# compose.yaml에 덧붙여 GPU 서버의 SGLang으로 실행합니다(Docker Compose 2.24.4 이상).
# vLLM이 지원하지 않는 모델(learning-unit/L1-16B-A3B, GravityMoE 구조)에 씁니다.
# 보통은 `./start-deployment.sh local`이 LLM_MODEL을 보고 이 파일을 고릅니다.
#   docker compose -f compose.yaml -f compose.sglang.yaml up -d
# SGLang 이미지는 docker/sglang-gravity(공식 v0.5.19 + GravityMoE 패치)로 만듭니다.
# 배포 압축에 이미지가 없으면 서버에서 처음 한 번 빌드합니다(베이스 이미지를 내려받을 외부 접속 필요).
services:
  sglang:
    build:
      context: ./docker/sglang-gravity
    image: ${SGLANG_IMAGE:-ax-g-sglang-gravity:0.5.19}
    command:
      - python3
      - -m
      - sglang.launch_server
      - --model-path=${LLM_MODEL:-learning-unit/L1-16B-A3B}
      - --served-model-name=${AI_MODEL:-l1-16b-a3b}
      # 설정 클래스(gravity_moe)가 모델 저장소의 코드입니다.
      - --trust-remote-code
      - --dtype=bfloat16
      - --tp=1
      # 모델 최대 32768. 가중치(bf16 약 32.5GB)를 뺀 나머지가 KV 캐시이며, MLA라 토큰당 약 32KB입니다.
      # 사고 모드는 입력(최대 약 14K 토큰) 뒤에 사고·답변 토큰(AI_MAX_OUTPUT_TOKENS)이 붙으므로 모델 최대값을 씁니다.
      - --context-length=${SGLANG_CONTEXT_LENGTH:-32768}
      # 가중치 + KV 캐시가 쓰는 GPU 메모리 비율입니다. OOM이면 낮추세요.
      # A100 80GB에서 L1-30B-A5B(가중치 약 59GB)는 KV 캐시가 약 11GB(약 18만 토큰)라 기동 OOM이면 0.85로 낮춥니다.
      - --mem-fraction-static=${SGLANG_MEM_FRACTION_STATIC:-0.88}
      # 모델 카드 권장 커널입니다.
      - --attention-backend=${SGLANG_ATTENTION_BACKEND:-triton}
      - --moe-runner-backend=${SGLANG_MOE_RUNNER_BACKEND:-triton}
      # GLM-4.5 형식 <think> 분리. 사고 내용은 reasoning_content로 빠지고 답변(content)에는 남지 않습니다.
      - --reasoning-parser=${SGLANG_REASONING_PARSER:-glm45}
      - --host=0.0.0.0
      - --port=8000
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      # 모델을 한 번 내려받은 뒤 1로 바꾸면 외부 접속 없이 기동합니다(vLLM과 같은 캐시·설정).
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    volumes:
      - ${HF_CACHE_DIR:-./hf-cache}:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # 쓸 GPU 번호(nvidia-smi 기준) 1장. 현재 GPU 서버에서 비어 있는 GPU입니다. 서버가 바뀌면 이 값을 고칩니다.
              device_ids: ["${GPU_DEVICE:-1}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      # 최초 기동은 모델 다운로드(약 32GB)·로딩·CUDA graph 캡처로 수 분이 걸립니다.
      start_period: 900s
    networks:
      - ai-inference
      - model-download
    restart: unless-stopped

  ax-g-ai:
    environment:
      AI_PROVIDER: openai_compatible
      AI_BASE_URL: http://sglang:8000/v1
      AI_MODEL: ${AI_MODEL:-l1-16b-a3b}
      # 작은 자체 모델용 프롬프트·답변 방식(본문의 DUR 판단 금지, DUR만 묻는 질문은 서버가 답함). compose.yaml의 capable을 덮어씁니다.
      AX_G_MODEL_PROFILE: ${AX_G_MODEL_PROFILE:-compact}
      # L1은 사고(<think>) 모드로 학습·평가된 모델이라 사고를 켭니다(코드 기본값은 끔). 첫 글자까지 시간이 늘어납니다.
      AI_DISABLE_THINKING: ${AI_DISABLE_THINKING:-false}
      # 모델 generation_config에 온도가 없어 지정하지 않으면 SGLang이 1.0을 써서 같은 입력에도 답이 크게 흔들립니다.
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.3}
      # 모델 카드 권장 반복 억제 계수와 지시문 앞 신원 문장. 비워 두면 보내지 않습니다(16B 기본).
      # start-deployment.sh가 L1-30B-A5B면 1.05와 "You are Chain-of-Evidence, …", 온도 0으로 채웁니다.
      AI_REPETITION_PENALTY: ${AI_REPETITION_PENALTY:-}
      AI_SYSTEM_PROMPT_PREFIX: ${AI_SYSTEM_PROMPT_PREFIX:-}
      # 사고를 끄고 보낼 작업(쉼표 구분). 사고 토큰은 첫 글자보다 먼저 생성되므로 추론이 거의 필요 없는 작업만 끈다.
      # start-deployment.sh가 L1-30B-A5B면 환자 요약(one_shot_patient_summary_stream)과 DUR 해설(dur_commentary_stream)로 채웁니다.
      AI_NO_THINKING_OPERATIONS: ${AI_NO_THINKING_OPERATIONS:-}
      # 사고 + 답변 토큰 상한(모델 카드 권장 2048 이상). 넘으면 잘린 응답으로 보고 오류 처리합니다.
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-6144}
      # 사고 시간을 포함한 Provider 요청 제한 시간(초). 코드 기본값 30초로는 부족합니다.
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-120}
    # 사내 PC에서 접속할 수 있게 모든 인터페이스에 엽니다. 인증이 없으므로 방화벽으로 접근을 제한하세요(서버 안에서만: 127.0.0.1).
    # Bridge와 같은 네트워크로만 쓰려면 이 항목을 비우세요(ports: !override []).
    ports: !override
      - "${AX_G_BIND:-0.0.0.0}:${AX_G_PORT:-8500}:8100"
    # 외부 AI 제공자용 네트워크(ai-provider-egress)를 뺍니다. EMR 프롬프트는 ai-inference 밖으로 나가지 않습니다.
    # api-ingress는 위 포트를 호스트에 게시하기 위한 네트워크입니다(internal 네트워크만 있으면 포트가 열리지 않습니다).
    networks: !override
      - bridge-ai
      - ai-inference
      - ai-data
      - api-ingress
    depends_on:
      sglang:
        condition: service_healthy
