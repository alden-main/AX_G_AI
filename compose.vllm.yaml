# A100 서버에서 vLLM과 AX-G AI를 함께 실행하는 Compose 파일입니다.
# 소스 없이 `docker load`한 AX-G AI 이미지와 .env만 있으면 실행됩니다.
#   docker compose -f compose.vllm.yaml up -d
# 자세한 절차는 docs/linux_docker_build.md를 참고하세요.
services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.11.0}
    command:
      - --model=${VLLM_MODEL:-Qwen/Qwen3-32B-AWQ}
      - --served-model-name=${AI_MODEL:-qwen3-32b-awq}
      - --max-model-len=${VLLM_MAX_MODEL_LEN:-16384}
      - --gpu-memory-utilization=${VLLM_GPU_MEMORY_UTILIZATION:-0.90}
      # Qwen3 사고 출력이 content에 섞이지 않게 분리합니다. 다른 계열 모델은 비우세요.
      - --reasoning-parser=${VLLM_REASONING_PARSER:-qwen3}
      - --enable-prefix-caching
      - --host=0.0.0.0
      - --port=8000
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      # 모델을 한 번 내려받은 뒤 1로 바꾸면 외부 접속 없이 기동합니다.
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    volumes:
      - ${HF_CACHE_DIR:-./hf-cache}:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      # 최초 기동은 모델 다운로드·로딩·CUDA graph 캡처로 수 분이 걸립니다.
      start_period: 900s
    networks:
      - ai-inference
      - model-download
    restart: unless-stopped

  # 말뭉치 DB(PostgreSQL + pgvector). 내부망(ai-data)에만 연결하고 호스트 포트를 열지 않습니다.
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.7-pg16}
    environment:
      POSTGRES_DB: ${CORPUS_DB_NAME:-axg_corpus}
      POSTGRES_USER: ${CORPUS_DB_USER:-axg}
      POSTGRES_PASSWORD: ${CORPUS_DB_PASSWORD:?CORPUS_DB_PASSWORD를 .env에 설정하세요}
    volumes:
      - corpus-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ai-data
    restart: unless-stopped

  # 임베딩 서버(TEI CPU + nlpai-lab/KURE-v1). 질문 문장은 내부망 밖으로 나가지 않습니다.
  # 최초 기동 시 모델(약 2.3GB)을 내려받으므로 model-download 네트워크가 필요합니다. 받은 뒤 HF_HUB_OFFLINE=1.
  # ARM 서버는 EMBEDDING_IMAGE=ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-1.9.4
  embedding:
    image: ${EMBEDDING_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4}
    command:
      - --model-id=${EMBEDDING_MODEL_ID:-nlpai-lab/KURE-v1}
      - --max-batch-tokens=${EMBEDDING_MAX_BATCH_TOKENS:-4096}
      - --max-client-batch-size=16
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    volumes:
      - ${HF_CACHE_DIR:-./hf-cache}:/data
    # 모델 적재 때 4GB 한도에서 OOM이 나는 것을 확인했습니다. CPU 4코어 이상 권장.
    mem_limit: ${EMBEDDING_MEM_LIMIT:-6g}
    cpus: ${EMBEDDING_CPUS:-4}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 600s
    networks:
      - ai-inference
      - model-download
    restart: unless-stopped

  # 말뭉치 적재(1회 실행): 새 말뭉치면 새 릴리스로 적재 → 바뀐 문단만 임베딩 → 활성 전환. 같은 말뭉치면 바로 끝납니다.
  # 롤백: docker compose run --rm corpus-loader --activate <release_id>
  corpus-loader:
    image: ${AX_G_AI_IMAGE:-ax-g-ai:1.0.0}
    entrypoint: ["ax-g-ai-load-corpus"]
    environment:
      AX_G_CORPUS_DATABASE_URL: postgresql://${CORPUS_DB_USER:-axg}:${CORPUS_DB_PASSWORD}@postgres:5432/${CORPUS_DB_NAME:-axg_corpus}
      AX_G_EMBEDDING_URL: http://embedding:80
      AX_G_EMBEDDING_MODEL: ${AX_G_EMBEDDING_MODEL:-kure-v1}
      AX_G_EMBEDDING_TIMEOUT_SECONDS: "120"
    depends_on:
      postgres:
        condition: service_healthy
      embedding:
        condition: service_healthy
    networks:
      - ai-data
      - ai-inference
    restart: "no"

  # DUR 적재(1회 실행): 이미지의 /app/data/dur 스냅샷을 dur 스키마에 데이터셋으로 적재 → 활성 전환. 같은 내용이면 바로 끝납니다.
  # 롤백: docker compose run --rm dur-loader --activate <dataset_id>
  dur-loader:
    image: ${AX_G_AI_IMAGE:-ax-g-ai:1.0.0}
    entrypoint: ["ax-g-ai-load-dur"]
    environment:
      AX_G_CORPUS_DATABASE_URL: postgresql://${CORPUS_DB_USER:-axg}:${CORPUS_DB_PASSWORD}@postgres:5432/${CORPUS_DB_NAME:-axg_corpus}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai-data
    restart: "no"

  ax-g-ai:
    image: ${AX_G_AI_IMAGE:-ax-g-ai:1.0.0}
    env_file:
      - .env
    environment:
      AI_PROVIDER: openai_compatible
      AI_BASE_URL: http://vllm:8000/v1
      AI_MODEL: ${AI_MODEL:-qwen3-32b-awq}
      AX_G_CORPUS_DATABASE_URL: postgresql://${CORPUS_DB_USER:-axg}:${CORPUS_DB_PASSWORD}@postgres:5432/${CORPUS_DB_NAME:-axg_corpus}
      AX_G_EMBEDDING_URL: http://embedding:80
      AX_G_EMBEDDING_MODEL: ${AX_G_EMBEDDING_MODEL:-kure-v1}
    expose:
      - "8100"
    ports:
      # 서버 내부 확인용입니다. Bridge와 같은 네트워크로만 쓰려면 이 항목을 지우세요.
      - "127.0.0.1:${AX_G_PORT:-8100}:8100"
    depends_on:
      vllm:
        condition: service_healthy
      corpus-loader:
        condition: service_completed_successfully
      dur-loader:
        condition: service_completed_successfully
    networks:
      - bridge-ai
      - ai-inference
      - ai-data
    restart: unless-stopped

networks:
  # Bridge와 AI service만 연결하는 내부 네트워크입니다.
  bridge-ai:
    internal: true
  # AX-G AI와 vLLM 사이의 내부 네트워크입니다. EMR 프롬프트는 이 네트워크 밖으로 나가지 않습니다.
  ai-inference:
    internal: true
  # 말뭉치 DB 전용 내부 네트워크입니다. postgres는 이 네트워크에만 연결합니다.
  ai-data:
    internal: true
  # vLLM·임베딩 서버의 모델 다운로드용 네트워크입니다. AX-G AI는 연결하지 않습니다.
  model-download: {}

volumes:
  corpus-db: {}
