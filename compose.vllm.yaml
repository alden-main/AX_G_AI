# compose.yaml에 덧붙여 GPU 서버의 vLLM으로 실행합니다(Docker Compose 2.24.4 이상).
# 보통은 `./start-deployment.sh local`이 LLM_MODEL을 보고 이 파일과 compose.sglang.yaml 중 하나를 고릅니다.
#   docker compose -f compose.yaml -f compose.vllm.yaml up -d
# 자세한 절차는 docs/linux_docker_build.md를 참고하세요.
services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.11.0}
    command:
      - --model=${LLM_MODEL:-${VLLM_MODEL:-Qwen/Qwen3-32B-AWQ}}
      - --served-model-name=${AI_MODEL:-qwen3-32b-awq}
      - --max-model-len=${VLLM_MAX_MODEL_LEN:-16384}
      - --gpu-memory-utilization=${VLLM_GPU_MEMORY_UTILIZATION:-0.90}
      # Qwen3 사고 출력이 content에 섞이지 않게 분리합니다. 다른 계열 모델은 그 모델의 parser로 바꾸세요.
      - --reasoning-parser=${VLLM_REASONING_PARSER:-qwen3}
      - --enable-prefix-caching
      - --host=0.0.0.0
      - --port=8000
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      # 모델을 한 번 내려받은 뒤 1로 바꾸면 외부 접속 없이 기동합니다.
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    volumes:
      - ${HF_CACHE_DIR:-./hf-cache}:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # 쓸 GPU 번호(nvidia-smi 기준) 1장. 여러 GPU 서버에서는 .env의 GPU_DEVICE로 비어 있는 GPU를 고릅니다.
              device_ids: ["${GPU_DEVICE:-0}"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      # 최초 기동은 모델 다운로드·로딩·CUDA graph 캡처로 수 분이 걸립니다.
      start_period: 900s
    networks:
      - ai-inference
      - model-download
    restart: unless-stopped

  ax-g-ai:
    environment:
      AI_PROVIDER: openai_compatible
      AI_BASE_URL: http://vllm:8000/v1
      AI_MODEL: ${AI_MODEL:-qwen3-32b-awq}
    # 기본은 서버 안에서만 열립니다(127.0.0.1). 사내 PC에서 테스트하려면 .env에 AX_G_BIND=0.0.0.0(인증 없이 열리므로 테스트 때만).
    # Bridge와 같은 네트워크로만 쓰려면 이 항목을 비우세요(ports: !override []).
    ports: !override
      - "${AX_G_BIND:-127.0.0.1}:${AX_G_PORT:-8100}:8100"
    # 외부 AI 제공자용 네트워크(ai-provider-egress)를 뺍니다. EMR 프롬프트는 ai-inference 밖으로 나가지 않습니다.
    networks: !override
      - bridge-ai
      - ai-inference
      - ai-data
    depends_on:
      vllm:
        condition: service_healthy
