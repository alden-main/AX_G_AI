services:
  # 말뭉치 DB(PostgreSQL + pgvector). 내부망(ai-data)에만 연결하고 호스트 포트를 열지 않습니다.
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.7-pg16}
    environment:
      POSTGRES_DB: ${CORPUS_DB_NAME:-axg_corpus}
      POSTGRES_USER: ${CORPUS_DB_USER:-axg}
      POSTGRES_PASSWORD: ${CORPUS_DB_PASSWORD:?CORPUS_DB_PASSWORD를 .env에 설정하세요}
    volumes:
      - corpus-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ai-data
    restart: unless-stopped

  # 임베딩 서버(TEI CPU + nlpai-lab/KURE-v1). 질문 문장은 내부망 밖으로 나가지 않습니다.
  # 최초 기동 시 모델(약 2.3GB)을 내려받으므로 model-download 네트워크가 필요합니다. 받은 뒤 HF_HUB_OFFLINE=1.
  # ARM 서버는 EMBEDDING_IMAGE=ghcr.io/huggingface/text-embeddings-inference:cpu-arm64-1.9.4
  embedding:
    image: ${EMBEDDING_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4}
    command:
      - --model-id=${EMBEDDING_MODEL_ID:-nlpai-lab/KURE-v1}
      - --max-batch-tokens=${EMBEDDING_MAX_BATCH_TOKENS:-4096}
      - --max-client-batch-size=16
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      # 배포 압축파일에 모델이 들어 있으면 start-deployment.sh가 EMBEDDING_HF_HUB_OFFLINE=1로 둡니다(vLLM 설정과 별개).
      HF_HUB_OFFLINE: ${EMBEDDING_HF_HUB_OFFLINE:-${HF_HUB_OFFLINE:-0}}
    volumes:
      - ${EMBEDDING_CACHE_DIR:-${HF_CACHE_DIR:-./hf-cache}}:/data
    # 모델 적재 때 4GB 한도에서 OOM이 나는 것을 확인했습니다. CPU 4코어 이상 권장.
    mem_limit: ${EMBEDDING_MEM_LIMIT:-6g}
    cpus: ${EMBEDDING_CPUS:-4}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 600s
    networks:
      - ai-inference
      - model-download
    restart: unless-stopped

  # 말뭉치 적재(1회 실행): 새 말뭉치면 새 릴리스로 적재 → 바뀐 문단만 임베딩 → 활성 전환. 같은 말뭉치면 바로 끝납니다.
  # 롤백: docker compose run --rm corpus-loader --activate <release_id>
  corpus-loader:
    image: ${AX_G_AI_IMAGE:-ax-g-ai:local}
    entrypoint: ["ax-g-ai-load-corpus"]
    environment:
      AX_G_CORPUS_DATABASE_URL: postgresql://${CORPUS_DB_USER:-axg}:${CORPUS_DB_PASSWORD}@postgres:5432/${CORPUS_DB_NAME:-axg_corpus}
      AX_G_EMBEDDING_URL: http://embedding:80
      AX_G_EMBEDDING_MODEL: ${AX_G_EMBEDDING_MODEL:-kure-v1}
      AX_G_EMBEDDING_TIMEOUT_SECONDS: "120"
    depends_on:
      postgres:
        condition: service_healthy
      embedding:
        condition: service_healthy
    networks:
      - ai-data
      - ai-inference
    restart: "no"

  # DUR 적재(1회 실행): 이미지의 /app/data/dur 스냅샷을 dur 스키마에 데이터셋으로 적재 → 활성 전환. 같은 내용이면 바로 끝납니다.
  # 롤백: docker compose run --rm dur-loader --activate <dataset_id>
  dur-loader:
    image: ${AX_G_AI_IMAGE:-ax-g-ai:local}
    entrypoint: ["ax-g-ai-load-dur"]
    environment:
      AX_G_CORPUS_DATABASE_URL: postgresql://${CORPUS_DB_USER:-axg}:${CORPUS_DB_PASSWORD}@postgres:5432/${CORPUS_DB_NAME:-axg_corpus}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai-data
    restart: "no"

  ax-g-ai:
    build: .
    image: ${AX_G_AI_IMAGE:-ax-g-ai:local}
    expose:
      - "8100"
    ports:
      # 사내망 PC에서 테스트할 수 있도록 호스트에 API 포트를 게시합니다.
      - "8100:8100"
    # .env: 비밀값(API 키 등)과 서버별로 바꿀 설정. 그 밖의 AX_G_*·AI_* 설정은 코드 기본값을 쓰며
    # 바꿀 때만 .env에 적는다(항목 설명: src/ax_g_ai/config.py, docs/linux_docker_build.md).
    env_file:
      - .env
    environment:
      # 코드 기본값과 다르게 운영하는 애플리케이션 설정. 서버별로 바꾸려면 같은 이름을 .env에 적는다.
      # 사고량: 비워 두면(AI_REASONING_EFFORT=) Provider 기본값(medium)을 쓴다.
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT-low}
      # 현재 말뭉치·용량 규칙은 전부 의료진 미검수(draft)라, 끄면 근거 인용·추천 진단/검사·용량 참고가 비활성이 된다.
      AX_G_EVIDENCE_INCLUDE_UNREVIEWED: ${AX_G_EVIDENCE_INCLUDE_UNREVIEWED:-true}
      AX_G_CLINICAL_DOSES_ENABLED: ${AX_G_CLINICAL_DOSES_ENABLED:-true}
      AX_G_CORPUS_DATABASE_URL: postgresql://${CORPUS_DB_USER:-axg}:${CORPUS_DB_PASSWORD}@postgres:5432/${CORPUS_DB_NAME:-axg_corpus}
      AX_G_EMBEDDING_URL: http://embedding:80
      AX_G_EMBEDDING_MODEL: ${AX_G_EMBEDDING_MODEL:-kure-v1}
      # 재부팅 때 postgres·redis와 동시에 시작되므로 연결될 때까지 기다린다(그 뒤에도 안 되면 경고 후 대체).
      AX_G_DEPENDENCY_STARTUP_WAIT_SECONDS: ${AX_G_DEPENDENCY_STARTUP_WAIT_SECONDS:-120}
    depends_on:
      corpus-loader:
        condition: service_completed_successfully
      dur-loader:
        condition: service_completed_successfully
    networks:
      - bridge-ai
      - ai-provider-egress
      - ai-inference
      - ai-data
    # 서버 재부팅·Docker 재시작 후에도 다시 뜹니다(docker compose stop/down으로 멈춘 경우는 제외).
    restart: unless-stopped

networks:
  # Bridge와 AI service만 연결하는 내부 네트워크입니다.
  bridge-ai:
    internal: true
  # AI Provider 호출용 네트워크입니다. Bridge는 이 네트워크에 연결하지 않습니다.
  ai-provider-egress: {}
  # AX-G AI와 임베딩 서버 사이의 내부 네트워크입니다.
  ai-inference:
    internal: true
  # 말뭉치 DB 전용 내부 네트워크입니다.
  ai-data:
    internal: true
  # 임베딩 모델 다운로드용 네트워크입니다. AX-G AI는 연결하지 않습니다.
  model-download: {}

volumes:
  corpus-db: {}
