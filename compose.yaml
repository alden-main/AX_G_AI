services:
  ax-g-ai:
    build: .
    expose:
      - "8100"
    ports:
      # 사내망 PC에서 테스트할 수 있도록 호스트에 API 포트를 게시합니다.
      - "8100:8100"
    env_file:
      - .env
    networks:
      - bridge-ai
      - ai-provider-egress

networks:
  # Bridge와 AI service만 연결하는 내부 네트워크입니다.
  bridge-ai:
    internal: true
  # AI Provider 호출용 네트워크입니다. Bridge는 이 네트워크에 연결하지 않습니다.
  ai-provider-egress: {}
