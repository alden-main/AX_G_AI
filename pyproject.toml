[project]
name = "ax-g-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cachetools>=5.3,<7",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "openai>=1.99,<3",
    "openinference-instrumentation-pydantic-ai>=0.1",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-sdk>=1.30",
    "psycopg[binary,pool]>=3.2,<4",
    "pyahocorasick>=2.1,<3",
    "pydantic-ai-slim[openai]>=1",
    "pydantic-settings>=2.4,<3",
    "redis>=5.2,<7",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
ax-g-ai = "ax_g_ai:main"
ax-g-ai-reference-db = "ax_g_ai.reference_data:main"
ax-g-ai-load-corpus = "ax_g_ai.corpus_store.loader:main"
ax-g-ai-build-dur = "ax_g_ai.dur_store.snapshot:main"
ax-g-ai-load-dur = "ax_g_ai.dur_store.loader:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Existing long lines are kept (no formatter is enforced); zip() lengths are checked by the callers.
ignore = ["E501", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
packages = ["ax_g_ai"]
mypy_path = "src"
ignore_missing_imports = true
check_untyped_defs = true
