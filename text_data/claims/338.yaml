# 338장 사구체 질환 — 주장(claim) 단위 최신화
# 스키마: text_data/claims/README.md
# A등급 출처: ERA 면역신장학 실무그룹의 ACR/VF 2021·EULAR 2022·KDIGO 2021 ANCA 연관 혈관염 사구체신염 권고 비교(Nephrol Dial Transplant 2023, CC BY).
# 원 지침(ACR·EULAR·KDIGO)은 C·B등급이라 직접 인용하지 않는다. 다른 사구체질환은 A등급 출처 미확보.

chapter: "338"
title: 사구체 질환
