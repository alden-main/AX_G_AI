# 347장 식도 질환 — 주장(claim) 단위 최신화
# 스키마: text_data/claims/README.md
# A등급 출처: JSGE GERD 지침 2021(J Gastroenterol 2022, CC BY — 일본 진료 환경 반영), openFDA(CC0).
#            캐나다 호산구성 식도염 성인·청소년 지침(Allergy Asthma Clin Immunol 2025, CC BY).

chapter: "347"
title: 식도 질환
original_source: HARRISON-19-KO
updated_at: "2026-11-10"

claims:
  - id: 347-C01
    topic: GERD 진단
    type: diagnosis
    original:
      text: "전형 증상(흉부작열감·역류), 내시경, 보행성 pH 감시. 증상 정도와 식도염 정도는 잘 일치하지 않음."
      location: {file: by_chapter/347장.md, line: 188}
    status: 유지
    current:
      text: >
        GERD는 임상 증상, 내시경·역류 감시 같은 객관적 검사, 위산억제 치료 반응을 종합해 진단한다. 증상 정도는 내시경 점막 손상 정도와 항상 일치하지 않는다.
        역류성 식도염 중증도는 LA 분류(경증 A·B, 중증 C·D)로 기술한다. 보행성 pH(또는 임피던스-pH) 감시만이 역류 부담과 증상-역류 관련성을 확인할 수 있다.
        PPI 시험은 전형 증상·흉통에 쓸 수 있는 실용적 방법이나 식도외 증상에는 가치가 제한적이다. 내시경 없이 PPI로 증상이 지속·재발하면 내시경을 한다. PPI 투여 중·후에는 정확한 내시경 진단이 어렵다.
        PPI 불응은 역류(산억제 부족 등) 또는 비역류 원인(기능성 흉부작열감, 호산구성 식도염, 운동장애, 정신 동반질환)일 수 있다.
      sources:
        - {id: PAPER-JSGE-GERD-2021, locator: "Summary of diagnosis; Fig. 1a, 1e"}
    verification: primary
    review: {status: draft}
    corpus:
      - kind: workup
        trigger: {all: [{finding: typical_reflux_symptoms}, {finding: symptoms_persist_or_relapse_after_ppi_trial}]}
        tests:
          - {exam: Upper_endoscopy, reason: "LA 분류, 다른 질환 감별"}
      - kind: workup
        trigger: {finding: ppi_refractory_gerd}
        tests:
          - {exam: Impedance_pH_monitoring, reason: "증상-역류 관련성·산억제 상태 평가"}
          - {exam: Esophageal_manometry, reason: 운동장애 감별}

  - id: 347-C02
    topic: GERD 초기·유지 치료(PPI·P-CAB)
    type: dose
    original:
      text: >
        생활습관 개선(유발 음식 회피, 야간 증상 시 침상 머리 올리기, 체중 감소). 위산 분비 억제가 주 치료 — PPI가 H2RA보다 효과적, PPI 간 큰 차이 없음. 증상 조절까지 치료, 최소 용량 사용.
      location: {file: by_chapter/347장.md, line: 214}
    status: 개정
    current:
      text: >
        생활습관 교정과 일시 증상 완화용 알지네이트·제산제를 병행한다. 경증 역류성 식도염 초기에는 PPI와 P-CAB(보노프라잔) 모두 1차로 권고한다(강한 권고, 근거 B).
        중증(LA C·D)은 보노프라잔 20 mg 1일 1회 4주를 제안한다(약한 권고, 근거 C). 비미란성(NERD)은 PPI 4주로 시작한다.
        표준 PPI로 점막 결손이 낫지 않거나 증상이 심하면 PPI 표준 용량 1일 2회 또는 보노프라잔 20 mg 1일 1회로 바꾸도록 권고한다(강한 권고, 근거 B).
        유지: 경증은 PPI(강한 권고), P-CAB(약한 권고), 최소 용량·필요시 투여 포함. 중증은 재발률이 낮은 보노프라잔 10 mg 1일 1회를 제안한다. 장기 PPI는 대체로 안전하나 주의 깊은 관찰이 필요하다.
        보노프라잔(미국 허가): 미란성 식도염 치유 20 mg 1일 1회 8주, 치유 후 유지 10 mg 1일 1회 최대 6개월, 비미란성 흉부작열감 10 mg 1일 1회 4주.
      sources:
        - {id: PAPER-JSGE-GERD-2021, locator: "Fig. 1b–d; CQ-1–CQ-6"}
        - {id: OPENFDA-VONOPRAZAN, locator: "2.1 Recommended Dosage"}
    verification: primary
    conflicts:
      - "중증 식도염 초기 기간: 일본 지침 보노프라잔 20 mg 4주, 미국 허가 8주."
    review: {status: draft}
    corpus:
      - kind: treatment
        condition: {kcd: [K21]}
        recommendations:
          - when: {finding: mild_reflux_esophagitis}
            recommend: {options: ["표준 용량 PPI", "보노프라잔 20 mg 1일 1회"]}
            strength: "JSGE 2021 CQ-1 (strong, B)"
          - when: {finding: severe_reflux_esophagitis}
            recommend: {ingredient: vonoprazan, dose: "20 mg 1일 1회"}
            strength: "JSGE 2021 CQ-2 (weak, C)"
          - when: {finding: standard_ppi_insufficient}
            recommend: {options: ["PPI 표준 용량 1일 2회", "보노프라잔 20 mg 1일 1회"]}
            strength: "JSGE 2021 CQ-3 (strong, B)"
      - kind: dose_rule
        id: DR-VONOPRAZAN-GERD
        ingredient: vonoprazan
        indication: 미란성 식도염·비미란성 GERD
        source_priority: [OPENFDA-VONOPRAZAN, PAPER-JSGE-GERD-2021]
        rules:
          - {when: {finding: erosive_esophagitis_healing}, action: "20 mg 1일 1회 8주(미국), 중증 4주(일본 지침)"}
          - {when: {finding: healed_erosive_esophagitis_maintenance}, action: "10 mg 1일 1회(미국 최대 6개월)"}
          - {when: {finding: nerd_heartburn}, action: "10 mg 1일 1회 4주(미국)"}

  - id: 347-C03
    topic: 항역류 수술
    type: treatment
    original:
      text: "(원문 해당 범위에 수술 적응증 상세 없음)"
      location: {file: by_chapter/347장.md, line: 214}
    status: 보완
    current:
      text: >
        수술 적응증은 PPI 저항성 GERD, 장기 PPI 유지가 필요한 경우, 역류로 인한 식도외 증상(천식, 쉰 목소리, 기침, 흉통, 흡인)이다. 장기 성적은 전형 증상에 만족스럽지만 PPI보다 우월하지는 않다.
        PPI 저항성 역류성 식도염에 항역류 수술을 제안하고(약한 권고, 근거 B), PPI 저항성 NERD는 임피던스-pH로 증상과 역류의 인과관계가 증명되면 제안한다(근거 C).
      sources:
        - {id: PAPER-JSGE-GERD-2021, locator: "Summary of surgical treatment; CQ-7, CQ-8"}
    verification: primary
    review: {status: draft}

  - id: 347-C04
    topic: 바렛식도
    type: workup
    original:
      text: "바렛식도: 장상피화생, 선암 위험 증가, 내시경 감시."
      location: {file: by_chapter/347장.md, line: 198}
    status: 유지
    current:
      text: >
        바렛식도의 발암 위험은 길이와 강하게 관련된다. 장분절 바렛식도(LSBE, 전주성 3 cm 이상)의 암 발생은 연 1.2%로 서구와 비슷해 감시 대상이 될 수 있고, 단분절(SSBE)의 감시 필요성은 일본에서 불분명하다.
        고용량 PPI가 발암 예방에 효과적일 수 있으나 일본에서 발암 예방 약물은 현재 쓰지 않는다(약한 권고, 근거 B). 바렛식도의 정의(조직학적 장상피화생 필요 여부 등)는 국제적으로 통일되지 않았다.
      sources:
        - {id: PAPER-JSGE-GERD-2021, locator: "Summary of BE; CQ-10"}
    verification: primary
    review: {status: draft}
    corpus:
      - kind: workup
        trigger: {finding: long_segment_barrett_3cm_plus}
        tests:
          - {exam: Surveillance_endoscopy, reason: "LSBE 암 발생 연 1.2% — 감시 대상"}

  - id: 347-C05
    topic: 식도이완불능증·감염성 식도염
    type: treatment
    original:
      text: "식도이완불능증(풍선확장·근절개·보툴리눔), 칸디다·헤르페스·CMV 식도염."
      location: {file: by_chapter/347장.md, line: 120}
    status: 확인불가
    verification: unverified
    review: {status: draft}
    note: "이번 묶음에서 A등급 출처 미확보(CC BY 지침 추가 검색 필요). 호산구성 식도염은 347-C06으로 분리."

  - id: 347-C06
    topic: 호산구성 식도염 진단과 치료
    type: treatment
    original:
      text: "호산구성 식도염: 식도 증상 + 편평상피 호산구 침착 생검으로 진단, 2차 원인 배제. 우선 위식도역류 감별을 위해 PPI 치료 시도(30~50% 소실), 국소 스테로이드·식이."
      location: {file: by_chapter/347장.md, line: 236}
    status: 개정
    current:
      text: >
        캐나다 성인·청소년 지침(2025): 진단에 PPI 시험 치료는 필요 없다. 내시경 모양과 관계없이 생검이 필요하며 최소 두 부위(원위·중간·근위)에서 부위당 2개 이상, 총 4–6개 이상을 채취하고, 0.3 mm²(고배율 시야)당 호산구 15개 이상이면 진단한다. 내시경 소견은 EREFS로 기록한다.
        음식 박힘으로 분비물을 삼키지 못하면 응급 내시경 제거가 필요하고 그때 생검을 함께 하는 것이 강력히 권장된다.
        초기 치료는 PPI, 경험적 식이 제거(우유 1가지 또는 우유·밀 2가지로 시작, 6가지 제거는 1차로 권하지 않음, 영양사 상담 필수), 삼키는 국소 스테로이드 중에서 고른다. 전신·장기 스테로이드(경구 프레드니손)는 일상적으로 쓰지 않는다.
        캐나다 허가 약은 부데소니드 구강붕해정(성인)이고, 점성 부데소니드·플루티카손 흡입기 삼킴은 허가 외다. 두필루맙은 기존 치료 불응·부작용이나 승인된 중증 알레르기 동반 질환에서 고려한다.
        협착 확장술은 염증 치료를 대체하지 않고 보완한다. 음식 원인 찾기용 알레르기 검사(피부단자·sIgE·첩포)는 권하지 않는다. 치료 변경 후 6–12주에 내시경·생검으로 효과를 평가한다(증상만으로는 불충분).
      sources:
        - {id: PAPER-CANADA-EOE-ADULT-2025, locator: "Final consensus statements #8, #10–13, #18–19, #24–26, #28–29, #34"}
    verification: primary
    conflicts:
      - "원문은 PPI 시험 치료로 위식도역류를 먼저 감별 — 현재는 진단에 PPI 시험 불필요(PPI는 치료 선택지 중 하나)."
    review: {status: draft}
    corpus:
      - kind: workup
        trigger: {any: [{finding: dysphagia}, {finding: food_impaction}]}
        tests:
          - {exam: EGD_with_esophageal_biopsy, reason: "부위 2곳 이상·총 4–6개 이상 생검, ≥15 호산구/hpf"}
      - kind: monitoring
        after: {event: eoe_treatment_change}
        check: [EGD_with_esophageal_biopsy]
        interval_weeks: [6, 12]
        rules:
          - {when: {always: true}, action: "증상만으로 치료 효과 판정하지 않음"}
      - kind: treatment
        condition: {kcd: [K20.0]}
        recommendations:
          - when: {all: [{dx: K20.0}, {med: prednisone}]}
            recommend: {action: avoid_routine, detail: "전신 스테로이드 일상 사용 비권장 — 삼키는 국소 스테로이드"}
            alert_level: medium
