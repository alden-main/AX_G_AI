  - id: 362-C07
    topic: 자가면역간염
    type: workup
    original:
      text: "자가면역간염 정의, 진단(자가항체, 고감마글로불린혈증, 조직), 스테로이드±아자티오프린 치료."
      location: {file: by_chapter/362장.md, line: 601}
    status: 유지
    current:
      text: >
        자가면역간염은 전형적인 임상·검사 소견(혈청 면역글로불린 G/감마글로불린 상승, 자가항체)과 병리 소견을 종합하고 다른 원인을 배제해 진단한다.
        간생검은 정확한 진단의 전제 조건이며 중첩증후군 확인에도 도움이 된다(특이 조직 소견이 없어 숙련된 병리의가 필요). 생검이 어려우면 간 탄성도 등 비침습 평가를 쓸 수 있다.
        IAIHG 간이 진단 기준은 ANA 또는 SMA(간접면역형광 ≥1:40 1점, ≥1:80 2점; 대안으로 anti-LKM1 ≥1:40 또는 anti-SLA 양성 2점), IgG(정상 상한 초과 1점, 1.1배 초과 2점),
        간 조직 소견, 바이러스 간염 배제를 점수화한다. 표준 치료는 프레드니손(프레드니솔론)과 아자티오프린이며, 부데소니드·마이코페놀레이트는 1차·대체 치료로 쓰일 수 있다.
        미노사이클린·니트로푸란토인 같은 약물 노출이 위험 요인으로 알려져 있다.
      sources:
        - {id: PAPER-APASL-AIH-2021, locator: "Diagnosis; Liver histology; Simplified criteria for the diagnosis of AIH; Standard treatment; Environmental factors"}
    verification: primary
    review: {status: draft}
    corpus:
      - kind: workup
        trigger:
          any:
            - {finding: suspected_autoimmune_hepatitis}
            - {finding: persistent_unexplained_alt_elevation}
        tests:
          - {lab: ANA, reason: "자가면역간염 간이 진단 기준"}
          - {lab: ASMA, reason: "자가면역간염 간이 진단 기준"}
          - {lab: Anti_LKM1, reason: "ANA·SMA 대안 자가항체"}
          - {lab: IgG, reason: "IgG 상승(정상 상한 배수로 점수화)"}
          - {exam: Liver_biopsy, reason: "진단의 전제 조건(숙련 병리 판독)"}
        notes: ["원인 불명 ALT 지속 상승을 자가면역간염 평가로 연결한 것은 운영 가정 — 검수 시 확정"]
