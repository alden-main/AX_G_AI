# 369장 담낭 및 담도질환 — 주장(claim) 단위 최신화
# 스키마: text_data/claims/README.md
# A등급 출처: WSES 급성 결석 담낭염 진단·치료 지침 2020 개정(World J Emerg Surg 2020, CC BY, GRADE).

chapter: "369"
title: 담낭 및 담도질환
original_source: HARRISON-19-KO
updated_at: "2026-11-10"

claims:
  - id: 369-C01
    topic: 급성 담낭염 진단
    type: workup
    original:
      text: "표 369-2 담낭질환 진단: 초음파(담석 진단 표준), 담도 신티그래피(HIDA), CT, MRI."
      location: {file: by_chapter/369장.md, line: 128}
    status: 유지
    current:
      text: >
        단일 임상·검사 소견만으로 급성 결석 담낭염을 진단하거나 배제하지 않고(강한 권고) 병력, 진찰, 검사, 영상을 조합한다. 복부 초음파가 1차 영상이다(강한 권고).
        선택된 환자에서 추가 영상을 쓰며, HIDA 스캔이 민감도·특이도가 가장 높고 CT의 진단 정확도는 낮으며 MRI는 초음파와 비슷하다.
      sources:
        - {id: PAPER-WSES-CHOLECYSTITIS-2020, locator: "Statements 1.1–1.4"}
    verification: primary
    review: {status: draft}
    corpus:
      - kind: workup
        trigger: {finding: suspected_acute_cholecystitis}
        tests:
          - {exam: Abdominal_US, reason: "1차 영상(강한 권고)"}
          - {lab: CBC, reason: "염증"}
          - {lab: CRP, reason: "염증"}
          - {lab: LFT, reason: "ALT·AST·빌리루빈·ALP·GGT — 담관결석 위험"}
          - {lab: Lipase, reason: "담석 췌장염 동반"}
          - {exam: HIDA_scan, when: "초음파 애매", reason: "가장 높은 정확도"}

  - id: 369-C02
    topic: 담관결석 위험 층화
    type: workup
    original:
      text: "담관결석증 진단과 치료(ERCP, 수술 중 담관조영)."
      location: {file: by_chapter/369장.md, line: 324}
    status: 개정
    current:
      text: >
        간기능 수치나 빌리루빈 상승만으로 담관결석을 판정하지 않고 추가 검사를 한다. 모든 급성 담낭염 환자에서 LFT(ALT, AST, 빌리루빈, ALP, GGT)와 복부 초음파로 담관결석 위험을 평가한다. 담관 직경 증가 단독으로는 불충분하다.
        위험 층화(ASGE·SAGES 변형): 매우 강한 예측인자 = 초음파상 담관결석, 상행 담관염. 강한 = 담관 직경 6 mm 초과(담낭 있음), 총빌리루빈 1.8 mg/dL 초과. 중등도 = 빌리루빈 외 간기능 이상, 55세 초과, 담석 췌장염.
        고위험(매우 강한 인자 하나라도)은 수술 전 ERCP, 수술 중 담관조영 또는 복강경 초음파, 중간위험은 수술 전 MRCP·EUS 또는 수술 중 담관조영·복강경 초음파를 한다. 담관결석은 수술 전·중·후 중 가능한 방법으로 제거한다.
      sources:
        - {id: PAPER-WSES-CHOLECYSTITIS-2020, locator: "Statements 2.1–2.8; Table 2"}
    verification: primary
    note: "추출된 WSES 표 2에는 고위험이 '매우 강한 인자 하나'로만 나옴 — 원 기준(Maple 2010)의 '강한 인자 2개 모두'가 표 셀 추출에서 빠졌을 수 있어 원문 표 확인 필요. ASGE 2019 개정 기준과도 다름."
    review: {status: draft}
    corpus:
      - kind: workup
        trigger: {all: [{dx: K81.0}, {any: [{finding: cbd_stone_on_us}, {finding: cholangitis}]}]}
        tests:
          - {exam: ERCP, reason: "담관결석 고위험 — 수술 전 ERCP 또는 수술 중 담관조영"}
      - kind: workup
        trigger: {all: [{dx: K81.0}, {not: {finding: cbd_stone_on_us}}, {not: {finding: cholangitis}}, {any: [{var: CBD_diameter_mm, op: ">", value: 6}, {var: Bilirubin_total, op: ">", value: 1.8}, {finding: abnormal_lft}, {var: age, op: ">", value: 55}, {finding: gallstone_pancreatitis}]}]}
        tests:
          - {exam: MRCP_or_EUS, reason: "담관결석 중간위험"}

  - id: 369-C03
    topic: 급성 담낭염 수술 시기와 수술 불가 환자
    type: treatment
    original:
      text: "합병증 없는 급성 담낭염은 진단 후 48~72시간 이내 조기 복강경 담낭절제. 조기 수술 위험이 높으면 지연. 중증이면 담낭조루술."
      location: {file: by_chapter/369장.md, line: 244}
    status: 개정
    current:
      text: >
        복강경 담낭절제가 1차 치료이고(강한 권고) 패혈성 쇼크나 절대적 마취 금기에서는 피한다. Child A·B 간경변, 80세 넘는 고령, 임신부에도 복강경 담낭절제를 제안한다.
        숙련된 외과의가 있으면 가능한 한 빨리, 입원 7일 이내·증상 시작 10일 이내에 조기 복강경 담낭절제를 한다(강한 권고). 그 안에 못 하면 첫 발현 6주 이후 지연 수술을 한다.
        고위험 환자에서도 즉시 복강경 담낭절제가 경피 담낭배액보다 우수하다(강한 권고). 수술에 적합하지 않은 환자는 담낭 배액(경피, 또는 숙련 기관에서 내시경 경유두·초음파 유도 경벽 배액)을 한다. 수술 거부·부적합 환자는 항생제와 관찰의 비수술 치료를 고려한다.
        해부학적 확인이 어렵고 손상 위험이 높으면 아전 담낭절제, 심한 염증·출혈·담관 손상 의심 시 개복 전환한다.
      sources:
        - {id: PAPER-WSES-CHOLECYSTITIS-2020, locator: "Statements 3.1–3.5; 4.1–4.2; 6.1–6.9"}
    verification: primary
    conflicts:
      - "조기 수술 시점: 원문 진단 후 48–72시간 vs WSES 입원 7일·증상 10일 이내 가능한 빨리."
    review: {status: draft}
    corpus:
      - kind: treatment
        condition: {kcd: [K80.0, K81.0]}
        recommendations:
          - when: {all: [{dx: K81.0}, {not: {finding: septic_shock}}, {not: {finding: absolute_anesthesia_contraindication}}]}
            recommend: {action: early_laparoscopic_cholecystectomy, timing: "입원 7일·증상 10일 이내 가능한 빨리"}
            strength: "WSES 2020 (strong)"
          - when: {all: [{dx: K81.0}, {any: [{finding: septic_shock}, {finding: unfit_for_surgery}]}]}
            recommend: {action: gallbladder_drainage, detail: "경피 또는 내시경 배액"}
            alert_level: high

  - id: 369-C04
    topic: 급성 담낭염 항생제
    type: treatment
    original:
      text: "심한 급성 담낭염 정주 항생제(우레이도페니실린, 암피실린-설박탐, 시프로플록사신, 목시플록사신, 3세대 세팔로스포린), 괴사·기종성은 메트로니다졸 추가."
      location: {file: by_chapter/369장.md, line: 240}
    status: 개정
    current:
      text: >
        합병증 없는 급성 결석 담낭염에서 담낭절제로 감염원이 조절되면 수술 후 항생제를 일상적으로 쓰지 않는다(강한 권고, 높은 근거).
        합병된 담낭염은 추정 병원체와 주요 내성 위험 인자에 따라 경험적 항생제를 고르고, 미생물 결과에 맞춰 표적 치료로 조정한다.
      sources:
        - {id: PAPER-WSES-CHOLECYSTITIS-2020, locator: "Statements 7.1–7.3"}
    verification: primary
    review: {status: draft}
    corpus:
      - kind: treatment
        condition: {kcd: [K81.0]}
        recommendations:
          - when: {all: [{event: cholecystectomy_done}, {finding: uncomplicated_cholecystitis}, {med_class: antibiotic}]}
            recommend: {action: stop, detail: "감염원 조절 후 수술 후 항생제 불필요(강한 권고)"}
            alert_level: medium

  - id: 369-C05
    topic: 무증상 담석
    type: treatment
    original:
      text: "무증상 담석 60~80%는 25년간 무증상, 증상 발생 연 2~4%, 합병증 연 0.1~0.3%. 예방적 담낭절제 불필요(자기양 담낭, 3 cm 이상 담석 등은 고려)."
      location: {file: by_chapter/369장.md, line: 158}
    status: 확인불가
    verification: unverified
    review: {status: draft}
    note: "WSES 2020은 급성 담낭염만 다룸 — 무증상 담석·담관염·경화성 담관염은 A등급 출처 미확보."
