# 376장 알레르기, 아나필락시스 및 전신 비만세포증 — 주장(claim) 단위 최신화
# 스키마: text_data/claims/README.md
# A등급 출처: 독일어권 알레르기·응급의학 학회 아나필락시스 급성 치료 S2k 지침 2021 개정(Allergo J Int 2021, CC BY), openFDA(CC0) 에피펜·네피.

chapter: "376"
title: 알레르기, 아나필락시스 및 전신 비만세포증
original_source: HARRISON-19-KO
updated_at: "2026-11-10"

claims:
  - id: 376-C01
    topic: 아나필락시스 에피네프린 투여
    type: dose
    original:
      text: "1:1,000(1 mg/mL) 에피네프린 0.3~0.5 mL 피하 또는 근육 주사, 5~20분 간격 반복. 혈압 유지 안 되면 1:10,000 에피네프린 2.5 mL 정주 5~10분 간격."
      location: {file: by_chapter/376장.md, line: 98}
    status: 개정
    current:
      text: >
        에피네프린이 아나필락시스 급성 치료의 가장 중요한 약이다. 소생술이 필요 없으면 즉시 허벅지 바깥쪽에 0.15–0.6 mg 근육 주사가 1차 약물치료이며(정맥보다 심장 부작용 위험이 훨씬 낮음), 효과가 없으면 5–10분마다 반복한다. 흡수가 불충분해 피하 주사는 더 이상 권하지 않는다.
        증상이 안정되지 않고 순환·호흡 부전이 임박하면 정맥 에피네프린(1 mg을 생리식염수 100 mL에 희석한 10 µg/mL, 1 µg/kg 단회 볼루스로 적정)을 심전도·맥박·혈압 감시하에 쓴다. 심혈관질환에서도 생명을 위협하는 아나필락시스에 절대 금기는 없다. 임신 중에도 에피네프린을 쓴다.
        베타차단제 복용자가 여러 차례 에피네프린에 반응하지 않으면 글루카곤을 쓴다. 후두부종에는 흡입 에피네프린(1 mg/mL 3–5 mL 분무)을 보조로, 기관지 폐쇄에는 흡입 베타작용제(살부타몰 2회, 효과 없으면 4–8회)를 추가한다.
        자가주사기(미국 허가): 30 kg 이상 에피펜 0.3 mg을 허벅지 앞바깥쪽에 근주(옷 위 가능, 정맥·엉덩이·손발가락 금지). 비강 에피네프린 네피(2024 승인): 30 kg 이상 2 mg, 15–30 kg 1 mg 1회 분무, 호전 없거나 악화되면 5분 뒤 같은 콧구멍에 새 기구로 2회째. 항상 2개를 지니게 한다.
      sources:
        - {id: PAPER-GERMAN-ANAPHYLAXIS-2021, locator: "Adrenaline (epinephrine); cardiovascular reaction; bronchial obstruction"}
        - {id: OPENFDA-EPINEPHRINE-EPIPEN, locator: "1; 2.1–2.2"}
        - {id: OPENFDA-EPINEPHRINE-NEFFY, locator: "1; 2.1"}
    verification: primary
    conflicts:
      - "원문 '피하 또는 근육' vs 현재 근육 주사만(피하 비권장). 정맥 용량: 원문 1:10,000 2.5 mL(0.25 mg) 반복 vs 현재 1 µg/kg 볼루스 적정."
    review: {status: draft}
    corpus:
      - kind: dose_rule
        id: DR-EPINEPHRINE-ANAPHYLAXIS
        ingredient: epinephrine
        indication: 아나필락시스
        source_priority: [PAPER-GERMAN-ANAPHYLAXIS-2021, OPENFDA-EPINEPHRINE-EPIPEN]
        standard_dose: "0.15–0.6 mg 허벅지 바깥쪽 근주(자가주사기 0.15/0.3/0.5 mg), 5–10분마다 반복"
        iv: "10 µg/mL 희석, 1 µg/kg 볼루스 적정(감시하, 순환·호흡 부전 임박 시)"
        nasal: "네피: ≥30 kg 2 mg, 15–30 kg 1 mg, 5분 뒤 재투여 가능"
        rules:
          - {when: {finding: anaphylaxis_epinephrine_route_subcutaneous}, action: "피하 주사 비권장 — 근주", alert: high}
          - {when: {all: [{finding: anaphylaxis}, {med_class: beta_blocker}, {finding: refractory_to_epinephrine}]}, action: "글루카곤 투여 고려", alert: high}
      - kind: treatment
        condition: {kcd: [T78.2, T78.0, T88.6]}
        recommendations:
          - when: {finding: anaphylaxis}
            recommend: {first_choice: epinephrine_im, detail: "즉시 근주 — 항히스타민·스테로이드보다 먼저"}
            alert_level: high

  - id: 376-C02
    topic: 수액·보조 약물·자세
    type: treatment
    original:
      text: "수 리터 생리식염수, 도파민. 산소 코 카테터, 알부테롤 흡입. 디펜히드라민 50~100 mg, 아미노필린 0.25~0.5 g, 메틸프레드니솔론 0.5~1 mg/kg."
      location: {file: by_chapter/376장.md, line: 100}
    status: 개정
    current:
      text: >
        눕힌 자세를 유지하고 갑자기 앉거나 서거나 움직이지 않게 한다(정맥 허탈 위험). 의식이 저하되고 순환이 유지되면 측와위.
        순환 반응이 주 증상이면 큰 구경(18G 이상) 정맥로로 균형 전해질 결정질을 5분 볼루스(성인 500–1,000 mL, 소아 20 mL/kg)로 주며, 성인 쇼크에는 1–3 L가 필요할 수 있다. 젤라틴·덱스트란은 히스타민 유리·아나필락시스 위험으로 쓰지 않는다.
        산소는 비재호흡 마스크로 FiO2 0.5 넘게 준다(비강 캐뉼라는 불충분). 항히스타민제(H1)는 모든 아나필락시스에 쓰되 에피네프린 근주와 생명 징후 안정 뒤에 준다. 글루코코르티코이드는 작용이 느려 급성기에 부차적이며 생명 징후 안정 뒤에만 쓴다.
      sources:
        - {id: PAPER-GERMAN-ANAPHYLAXIS-2021, locator: "Volume replacement; Antihistamines; Glucocorticoids; positioning; cardiovascular reaction"}
    verification: primary
    conflicts:
      - "원문 산소 '코 카테터' vs 현재 비재호흡 마스크(비강 캐뉼라 불충분). 원문 아미노필린은 현재 지침에 없음."
    review: {status: draft}
    corpus:
      - kind: treatment
        condition: {kcd: [T78.2]}
        recommendations:
          - when: {all: [{finding: anaphylaxis}, {finding: hypotension}]}
            recommend: {fluid: balanced_crystalloid_bolus, adult: "500–1,000 mL/5분", child: "20 mL/kg", position: supine}
            alert_level: high
          - when: {all: [{finding: anaphylaxis}, {any: [{med_class: antihistamine}, {med_class: systemic_glucocorticoid}]}, {not: {med: epinephrine}}]}
            recommend: {action: alert, detail: "항히스타민·스테로이드는 에피네프린을 대체하지 않음"}
            alert_level: high

  - id: 376-C03
    topic: 트립타제와 퇴원 관리·자가주사기 처방
    type: workup
    original:
      text: "혈청 트립타제 증가는 비만세포 활성화 시사, 반감기가 짧아 전신반응 4시간 안에 확인. 음식 아나필락시스는 트립타제 상승과 연관성 낮음."
      location: {file: by_chapter/376장.md, line: 94}
    status: 보완
    current:
      text: >
        급성 치료 후 혈청 트립타제를 이상적으로 발생 1–3시간에 재고, 가능하면 기저치를 따로 잰다. 퇴원 시 환자·가족에게 질환을 설명하고 알레르기 진단 검사를 연계하며, 증상·동반 인자·원인 후보를 기록하고 아나필락시스 수첩을 준다. 곤충 독은 알레르겐 면역요법을 논의한다.
        에피네프린 자가주사기 처방 대상: 전신 알레르기 반응 + 기관지 천식(아나필락시스 병력 없어도), 증상이 점점 심해지는 전신 반응, 피할 수 없는 원인에 대한 아나필락시스 병력, 땅콩·견과·우유·참깨 같은 강력 알레르겐에 대한 피부 외 증상, 극미량에 반응, 비만세포증 성인.
        두 번째 자가주사기: 매우 심한 아나필락시스 병력, 체중 100 kg 초과 등.
      sources:
        - {id: PAPER-GERMAN-ANAPHYLAXIS-2021, locator: "Diagnosis; discharge management; Tables 10–11"}
    verification: primary
    review: {status: draft}
    corpus:
      - kind: workup
        trigger: {finding: anaphylaxis}
        tests:
          - {lab: Tryptase, timing: "발생 1–3시간", reason: "비만세포 활성화 — 기저치와 비교"}
      - kind: treatment
        condition: {kcd: [T78.2, Z91.0]}
        recommendations:
          - when: {all: [{event: anaphylaxis_discharge}, {not: {med: epinephrine}}]}
            recommend: {prescribe: epinephrine_autoinjector, detail: "응급 키트·교육·알레르기 진단 연계"}
            alert_level: high
          - when: {all: [{finding: systemic_allergic_reaction}, {dx: J45}, {not: {med: epinephrine}}]}
            recommend: {prescribe: epinephrine_autoinjector}
          - when: {all: [{med: epinephrine}, {var: weight_kg, op: ">", value: 100}]}
            recommend: {prescribe: second_epinephrine_autoinjector}

  - id: 376-C04
    topic: 두드러기·혈관부종·비만세포증·알레르기비염
    type: treatment
    original:
      text: "두드러기·혈관부종 분류와 치료, 전신 비만세포증 진단기준, 알레르기비염 치료."
      location: {file: by_chapter/376장.md, line: 182}
    status: 확인불가
    verification: unverified
    review: {status: draft}
    note: "이번 묶음에서 A등급 출처 미확보."
