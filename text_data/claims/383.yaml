# 383장 쇠그렌증후군 — 주장(claim) 단위 최신화
# 스키마: text_data/claims/README.md
# A등급 출처: 영국류마티스학회(BSR) 성인·소아 쇠그렌병 관리 지침(Rheumatology 2025, CC BY, GRADE).

chapter: "383"
title: 쇠그렌증후군
original_source: HARRISON-19-KO
updated_at: "2026-11-10"

claims:
  - id: 383-C01
    topic: 진단 검사(항체·초음파·생검)
    type: workup
    original:
      text: "표 383-5 개정된 국제 분류기준: 눈·구강 증상, 눈 검사, 소타액선 조직병리(focus 점수 1 이상), 타액선 침범, 항Ro/SS-A·La/SS-B 항체."
      location: {file: by_chapter/383장.md, line: 110}
    status: 개정
    current:
      text: >
        쇠그렌병이나 다른 결합조직질환의 임상 단서가 없으면 ANA를 측정하지 않는다(1C). 결합조직질환이 의심되면 ANA를 선별 항체로 쓰고, 쇠그렌병 의심이 높으면 ANA 음성이어도 ENA(항Ro 등)를 측정한다(1C).
        타액선 초음파는 진단을 뒷받침하는 정보를 주지만 성인 분류 기준에서 항체·조직 검사를 대체하지 않는다(1A). 일상 평가에 초음파 외 추가 영상은 권하지 않는다. 임상·혈청으로 진단되지 않으면 소순 타액선 생검을 고려한다(1A). 눈물샘 생검은 일상적으로 권하지 않는다.
      sources:
        - {id: PAPER-BSR-SJOGREN-2025, locator: "Diagnosis — serology, USS, biopsy recommendations"}
    verification: primary
    note: "원문 분류기준은 2002 AECG — 현재 성인 분류는 2016 ACR/EULAR(원문 C등급, 미대조)."
    review: {status: draft}
    corpus:
      - kind: workup
        trigger: {finding: suspected_sjogren}
        tests:
          - {lab: ANA, reason: "선별"}
          - {lab: Anti_Ro_SSA, reason: "ANA 음성이어도 의심 높으면 측정"}
          - {lab: Anti_La_SSB, reason: "ENA"}
          - {exam: Salivary_gland_US, reason: "보조 진단"}
          - {exam: Minor_salivary_gland_biopsy, when: "임상·혈청으로 진단 불가", reason: "확진"}

  - id: 383-C02
    topic: 기저 평가와 동반질환 선별·림프종 경고
    type: workup
    original:
      text: "표 383-2 분비선외 증상(림프종, 신세뇨관산증 등). 고등급 림프종 CHOP + 항CD20."
      location: {file: by_chapter/383장.md, line: 66}
    status: 보완
    current:
      text: >
        기저 평가는 분비선 외 침범·진행 위험을 판단하기 위한 철저한 임상·혈청 평가를 포함한다(1B). 기저와 임상적으로 필요할 때 비타민 D, 갑상선 기능, 간기능(필요 시 항미토콘드리아 항체), TTG(셀리악), 면역글로불린과 혈청 단백 전기영동, 혈청 중탄산염(원위 세뇨관 산증: 완전형 약 5%, 불완전형 25%), CK를 잰다.
        새 침샘 종대나 림프종을 시사하는 증상이 생기면 조기에 추가 검사한다(1A). 단클론 감마병증은 약 22%에서 보이며 분비선 외 침범과 관련된다.
      sources:
        - {id: PAPER-BSR-SJOGREN-2025, locator: "Lymphoma risk; Baseline assessment; Associated conditions (Q5)"}
    verification: primary
    conflicts:
      - "원문 CHOP 약어 풀이 'cyclosporine'은 오기 — CHOP의 C는 cyclophosphamide."
    review: {status: draft}
    corpus:
      - kind: workup
        trigger: {dx: M35.0}
        tests:
          - {lab: Vitamin_D_25OH, reason: "기저(1B)"}
          - {lab: TSH, reason: "갑상선 질환 동반"}
          - {lab: LFT, reason: "간 침범"}
          - {lab: tTG_IgA, reason: "셀리악 동반"}
          - {lab: Immunoglobulins, reason: "고감마글로불린혈증"}
          - {lab: SPEP, reason: "단클론 감마병증"}
          - {lab: Bicarbonate, reason: "원위 세뇨관 산증"}
          - {lab: CK, reason: "근염"}
      - kind: referral
        to: 류마티스내과·혈액종양내과
        criteria:
          - {all: [{dx: M35.0}, {any: [{finding: new_salivary_gland_swelling}, {finding: lymphoma_b_symptoms}]}]}
        purpose: ["림프종 조기 평가"]

  - id: 383-C03
    topic: 건조 증상 치료
    type: dose
    original:
      text: "인공눈물(히프로멜로스 등), 물, 필로카르핀 5 mg 1일 3회 또는 세비멜린 30 mg 1일 3회. 눈물·타액 감소 약물(이뇨제, 항고혈압제, 항콜린제, 항우울제) 회피."
      location: {file: by_chapter/383장.md, line: 153}
    status: 유지
    current:
      text: >
        눈: 보존제 없는 인공눈물을 규칙적으로(예: 2–3시간마다) 쓰고(1A), 매일 10분 이상 온찜질(1A). 기존 점안제로 조절되지 않으면 자가·동종 혈청 점안, 안과 감독하 단기 국소 스테로이드, 국소 사이클로스포린을 쓴다. 마이봄샘 기능장애·안검염에는 항염 작용 항생제 단기, 지질 점안제를 고려한다.
        입: 침 대체제(2C), 불소 치약 칫솔질, 적극적 치과 관리, 자일리톨 제품. 질 건조는 비호르몬 보습제와 폐경 전후 여성은 에스트로겐 크림을 고려한다.
        잔존 분비 기능이 있고 눈·입 건조가 심하면 필로카르핀 5 mg 1일 1회로 시작해 5 mg 1일 3–4회까지 시도한다(1A).
      sources:
        - {id: PAPER-BSR-SJOGREN-2025, locator: "Q6–Q9 sicca treatments"}
    verification: primary
    review: {status: draft}
    corpus:
      - kind: dose_rule
        id: DR-PILOCARPINE-SJOGREN
        ingredient: pilocarpine
        indication: 쇠그렌병 건조 증상(잔존 분비 기능)
        source_priority: [PAPER-BSR-SJOGREN-2025]
        starting_dose: "5 mg 1일 1회"
        titration: "5 mg 1일 3–4회까지"
        rules:
          - {when: {any: [{med_class: anticholinergic}, {med_class: tricyclic_antidepressant}]}, action: "건조 악화 약물 — 재검토", alert: caution}

  - id: 383-C04
    topic: 전신 치료(하이드록시클로로퀸·스테로이드·면역억제제)와 임신
    type: treatment
    original:
      text: "하이드록시클로로퀸 200 mg은 관절통·경한 관절염. 글루코코르티코이드 1 mg/kg/일·사이클로포스파마이드는 전신 혈관염에서만. TNF 차단제 효과 없음. 항CD20은 전신 질환에 도움."
      location: {file: by_chapter/383장.md, line: 157}
    status: 개정
    current:
      text: >
        피로·전신 증상이 심하거나 고감마글로불린혈증이 뚜렷하면 하이드록시클로로퀸을 6–12개월 시도한다(2C). 전신 스테로이드는 특정 적응증에 단기간만 쓰고 일상적으로 쓰지 않는다. 기존 면역억제제·생물학적 제제·IVIG는 특정 전신 합병증 치료 외에는 권하지 않는다.
        피로에는 활동 관리·수면·생활습관 중심의 개별 평가와 운동을 권한다.
        임신: 전자간증 고위험이면 저용량 아스피린(1A). 항Ro 양성은 임신 중 하이드록시클로로퀸을 고려하고(PATCH 연구, 2C), 이전 임신에서 선천 심장 차단이 있었으면 다음 임신에 하이드록시클로로퀸을 제공한다(1B). 선천 심장 차단이 발견되면 덱사메타손 고려를 위해 전문 센터로 긴급 의뢰한다.
      sources:
        - {id: PAPER-BSR-SJOGREN-2025, locator: "Q10–Q14 systemic therapy; fatigue; Q16–Q17 pregnancy"}
    verification: primary
    review: {status: draft}
    corpus:
      - kind: treatment
        condition: {kcd: [M35.0]}
        recommendations:
          - when: {all: [{dx: M35.0}, {any: [{finding: pregnancy}, {event: pregnancy_planned}]}, {finding: anti_ro_positive}, {finding: prior_congenital_heart_block}]}
            recommend: {ingredient: hydroxychloroquine, detail: "이전 선천 심장 차단 — 다음 임신 HCQ(1B)"}
            alert_level: high
          - when: {all: [{dx: M35.0}, {med_class: systemic_glucocorticoid}, {var: steroid_months, op: ">=", value: 3}, {not: {finding: systemic_complication}}]}
            recommend: {action: review, detail: "전신 합병증 없는 장기 스테로이드 비권장"}
            alert_level: medium
