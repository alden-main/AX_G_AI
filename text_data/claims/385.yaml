# A등급 출처: 노르웨이 류마티스학회 거대세포동맥염 진단·치료 권고(Front Med 2022, CC BY — EULAR·BSR 기반),
#            ANCA 연관 혈관염 ACR/EULAR/KDIGO 비교(Nephrol Dial Transplant 2023, CC BY).

chapter: "385"
title: 혈관염 증후군
original_source: HARRISON-19-KO
updated_at: "2026-11-10"

claims:
  - id: 385-C01
    topic: 거대세포동맥염 진단(빠른 진료 경로·초음파)
    type: workup
    original:
      text: "50세 이상 환자에서 다발성근육통 동반 여부, 발열, 빈혈, ESR 상승. 측두동맥 조직검사로 확진(3~5 cm). 측두동맥 초음파도 도움. 조직검사 때문에 치료를 지연해서는 안 됨."
      location: {file: by_chapter/385장.md, line: 425}
    status: 개정
    current:
      text: >
        의심 환자는 다발근육통 증상, 새로운 두통, 혀·턱 파행, 시각 장애, 팔다리 파행, 전신 증상을 묻고 양팔 혈압, 체온, 심폐 청진과 CRP·ESR 등 검사를 한다.
        24시간 안에 빠른 진료 클리닉이나 류마티스내과로 의뢰하고, 평가를 기다리느라 치료를 늦추지 않는다. 1차 진단 검사는 숙련자의 고사양 초음파로 최소 측두·겨드랑 동맥을 보며(안면 동맥 추가 시 민감도 증가), 초음파가 불가하거나 애매하면 측두동맥 생검을 고려한다.
        임상 의심이 높고 진단 검사(생검 또는 영상)가 양성이면 추가 검사가 필요 없다. 시각 증상이 있으면 안과로 의뢰하되 치료는 늦추지 않는다.
      sources:
        - {id: PAPER-NORWAY-GCA-2022, locator: "Recommendations 1–5; Table 5"}
    verification: primary
    conflicts:
      - "원문은 측두동맥 생검을 확진 표준으로 서술 — 현재는 초음파가 1차 진단 검사(빠른 진료 클리닉)."
    review: {status: draft}
    corpus:
      - kind: workup
        trigger: {all: [{var: age, op: ">=", value: 50}, {any: [{finding: new_headache}, {finding: jaw_claudication}, {finding: visual_disturbance}, {finding: polymyalgia_symptoms}]}]}
        tests:
          - {lab: CRP, reason: "염증"}
          - {lab: ESR, reason: "염증"}
          - {exam: Temporal_axillary_artery_US, reason: "1차 진단(빠른 진료 클리닉, 24시간 내)"}
          - {exam: Temporal_artery_biopsy, when: "초음파 불가·애매", reason: "확진"}
      - kind: referral
        to: 류마티스내과(빠른 진료 클리닉)·시각 증상 시 안과
        criteria:
          - {finding: suspected_giant_cell_arteritis}
        purpose: ["24시간 내 평가", "치료는 지연하지 않음"]

  - id: 385-C02
    topic: 거대세포동맥염 스테로이드와 감량
    type: dose
    original:
      text: "프레드니손 40~60 mg/일로 시작해 약 한 달 사용 후 감량. 안과 증상 시 메틸프레드니솔론 1,000 mg 3일. 대부분 2년 이상 치료. 감량 중 재발 65~85%."
      location: {file: by_chapter/385장.md, line: 431}
    status: 유지
    current:
      text: >
        의심되면 즉시 글루코코르티코이드를 시작하고 진단 검사로 치료를 늦추지 않는다. 시각 증상이 없으면 프레드니솔론 40 mg/일, 시각 침범(시력 상실, 복시, 일과성 흑암시, 시야 흐림)이 있으면 60 mg/일로 시작하고 메틸프레드니솔론 500 mg 정주 1회를 고려한다.
        감량: 20 mg/일까지 2주마다 5 mg, 이후 10 mg/일까지 3주마다 2.5 mg, 이후 5 mg/일까지 3주마다 1.25 mg 줄이고, 시작 후 최소 1년은 5 mg/일을 유지한다.
        경미한 재발은 마지막 유효 용량으로 올리고, 불응성이나 주요 재발(허혈 증상, 대동맥 진행)에는 메토트렉세이트 20 mg/주 피하 추가를 고려하며, 불내·불응이면 토실리주맙 162 mg/주 피하를 고려한다. 새로 진단되면 골밀도를 측정하고 골다공증 고위험이면 치료한다.
      sources:
        - {id: PAPER-NORWAY-GCA-2022, locator: "Recommendations 6–9; Tables 6–7"}
    verification: primary
    note: "ACR 2021은 토실리주맙을 초기부터 권장 — 노르웨이 권고는 메토트렉세이트 다음 단계로 둠(국가별 차이)."
    review: {status: draft}
    corpus:
      - kind: dose_rule
        id: DR-PREDNISOLONE-GCA
        ingredient: prednisolone
        indication: 거대세포동맥염
        source_priority: [PAPER-NORWAY-GCA-2022]
        starting_dose: {no_visual: "40 mg/일", visual: "60 mg/일 ± 메틸프레드니솔론 500 mg 정주 1회"}
        taper: "→20 mg: 2주마다 5 mg; →10 mg: 3주마다 2.5 mg; →5 mg: 3주마다 1.25 mg; 5 mg 최소 1년"
        rules:
          - {when: {finding: gca_major_relapse}, action: "메토트렉세이트 20 mg/주 피하 추가 고려, 이후 토실리주맙", alert: caution}
          - {when: {not: {event: bmd_measured}}, action: "골밀도 측정·골다공증 치료 검토", alert: caution}
      - kind: treatment
        condition: {kcd: [M31.5, M31.6]}
        recommendations:
          - when: {all: [{finding: suspected_giant_cell_arteritis}, {not: {med_class: systemic_glucocorticoid}}]}
            recommend: {action: start_glucocorticoid_now, detail: "검사로 치료 지연 금지"}
            alert_level: high

  - id: 385-C03
    topic: 육아종증 다발혈관염·현미경적 다발혈관염 치료
    type: treatment
    original:
      text: "중증 베게너 육아종증: 사이클로포스파마이드 + 부신피질 호르몬 유도 3~6개월 후 메토트렉세이트·아자티오프린 유지(최소 2년). 리툭시맙 유도치료 FDA 승인."
      location: {file: by_chapter/385장.md, line: 224}
    status: 개정
    current:
      text: "338-C01(관해 유도)·338-C02(관해 유지) 참조 — 리툭시맙이 유지 치료 1차, 감량 스테로이드(PEXIVAS), 아바코판 보조, 유지 최소 18개월."
      sources:
        - {id: PAPER-ANCA-GN-NDT-2023, locator: "Remission-induction; Remission-maintenance"}
    verification: primary
    review: {status: draft}

