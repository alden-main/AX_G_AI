# 402장 뇌하수체저하증 — 주장(claim) 단위 최신화
# 스키마: text_data/claims/README.md
# A등급 출처: 브라질 내분비대사학회 뇌하수체저하증 관리 관점(Arch Endocrinol Metab 2021, CC BY — 국제 지침(Endocrine Society 2016 등) 종합,
#            브라질 약제 가용성 반영), 부신기능부전 치료·부신위기 권고(Endocrine 2021, CC BY — Endo-ERN).

chapter: "402"
title: 뇌하수체저하증
original_source: HARRISON-19-KO
updated_at: "2026-11-10"

claims:
  - id: 402-C01
    topic: 중추성 갑상선저하증 진단과 레보티록신 보충
    type: dose
    original:
      text: "유리 티록신이 낮은데 TSH가 낮거나 부적절하게 정상이면 2차성 갑상샘저하증. 표 402-3: L-티록신 매일 0.75~0.15 mg."
      location: {file: by_chapter/402장.md, line: 84}
    status: 개정
    current:
      text: >
        중추성 갑상선저하증은 낮은 유리 T4와 낮거나 부적절하게 정상인 TSH로 진단한다(TSH가 약간 높을 수 있으나 대개 10 IU/L 미만). 보충은 레보티록신(LT4)이며 T3 보충은 권하지 않는다.
        성인 평균 용량은 1.6 µg/kg/일이고 대부분 전량으로 시작할 수 있으나, 고령·심장·신경질환에서는 저용량으로 시작해 6–8주 간격으로 증상과 유리 T4를 보며 올린다(이후 6–12개월마다).
        목표는 유리 T4 참고범위 상위 절반이며 LT4 복용 전에 채혈한다. TSH·T3 측정은 대개 불필요하다(TSH는 낮은 것이 정상, T3가 높으면 과량).
        부신축을 먼저 평가하고, ACTH 결핍이 함께 있으면 부신위기 위험 때문에 글루코코르티코이드 보충 뒤에 LT4를 시작한다. 경구 에스트로겐은 TBG를 올려 LT4 요구량을 늘리고, 성장호르몬 시작 6주 뒤 유리 T4를 재평가한다.
      sources:
        - {id: PAPER-BRAZIL-HYPOPITUITARISM-2021, locator: "Central hypothyroidism (TSH deficiency); Hormonal interactions during pituitary hormone replacement"}
    verification: primary
    conflicts:
      - "원문 표 402-3 'L-티록신 매일 0.75~0.15 mg'은 0.075~0.15 mg의 인쇄 오기로 보임(원문 주석도 확인 필요 표시)."
    review: {status: draft}
    corpus:
      - kind: dose_rule
        id: DR-LT4-CENTRAL-HYPOTHYROIDISM
        ingredient: levothyroxine
        indication: 중추성 갑상선저하증
        source_priority: [PAPER-BRAZIL-HYPOPITUITARISM-2021]
        standard_dose: "1.6 µg/kg/일(평균) — 고령·심장·신경질환은 저용량 시작"
        target: "유리 T4 참고범위 상위 절반(복용 전 채혈), TSH로 조절하지 않음"
        rules:
          - {when: {all: [{dx: E23.0}, {finding: acth_deficiency}, {not: {med_class: systemic_glucocorticoid}}]}, action: "글루코코르티코이드 보충 후 레보티록신 시작(부신위기 위험)", alert: high}
          - {when: {any: [{var: age, op: ">=", value: 65}, {dx: I25}, {dx: I48}]}, action: "저용량 시작, 6–8주 간격 증량", alert: caution}
      - kind: monitoring
        after: {event: levothyroxine_start_or_dose_change}
        check: [FT4]
        interval_weeks: [6, 8]
        rules:
          - {when: {dx: E23.0}, action: "중추성 갑상선저하증은 TSH가 아니라 유리 T4로 용량 조절"}

  - id: 402-C02
    topic: ACTH 결핍(2차 부신기능부전) 진단 검사
    type: workup
    original:
      text: "낮은 코티솔에도 부적절하게 낮은 ACTH는 ACTH 예비능 감소. ACTH 자극, 인슐린 저혈당, 메티라폰, CRH 검사."
      location: {file: by_chapter/402장.md, line: 214}
    status: 개정
    current:
      text: >
        뇌하수체저하증에서 오전 8–9시 코티솔이 100 nmol/L(3 µg/dL) 미만이면 2차 부신기능부전을 강하게 시사하고, 15 µg/dL 초과이면 배제한다. 3–15 µg/dL은 추가 검사가 필요하다(절단값은 측정법에 따라 다름).
        인슐린 내성 검사가 표준이지만(최고 코티솔 500 nmol/L[18 µg/dL] 미만이면 진단, 질량분석 표준화 신형 측정법은 약 12 µg/dL) 뇌전증·부정맥·뇌혈관질환에서는 금기다.
        가장 간단한 것은 합성 ACTH 250 µg 신속 검사로, 30·60분 최고 코티솔 18 µg/dL 미만이면 확진한다. 뇌하수체 손상·수술 후 4주 이내나 부분 결핍에서는 거짓 음성이 생길 수 있다.
        ACTH 수치만으로는 2차 부신기능부전을 진단할 수 없다. 하이드로코르티손 복용자는 마지막 복용 24시간 뒤 측정하고, 경구 에스트로겐은 CBG 증가로 혈청 코티솔을 20–50% 높인다.
        부신위기가 의심되면 진단 검사 때문에 하이드로코르티손 투여를 늦추지 않는다.
      sources:
        - {id: PAPER-BRAZIL-HYPOPITUITARISM-2021, locator: "Secondary adrenal insufficiency (ACTH deficiency); Figure 1"}
    verification: primary
    review: {status: draft}
    corpus:
      - kind: lab_threshold
        lab: Cortisol_AM
        unit: µg/dL
        context: "뇌하수체저하증에서 오전 8–9시 코티솔(측정법 의존, 경구 에스트로겐·글루코코르티코이드 복용 시 해석 주의)"
        bands:
          - {label: "2차 부신기능부전 강력 시사", max: 2.999}
          - {label: "추가 동적 검사 필요", min: 3, max: 15}
          - {label: "2차 부신기능부전 배제", min: 15.001}
      - kind: workup
        trigger: {all: [{dx: E23.0}, {var: Cortisol_AM, op: ">=", value: 3}, {var: Cortisol_AM, op: "<=", value: 15}]}
        tests:
          - {lab: ACTH_stimulation_test_250ug, reason: "최고 코티솔 <18 µg/dL이면 확진(손상 4주 이내 거짓 음성)"}

  - id: 402-C03
    topic: ACTH 결핍의 글루코코르티코이드 보충
    type: dose
    original:
      text: "하이드로코티손 25 mg/일을 넘기지 않고 2~3회 분할. 프레드니손 매일 아침 5 mg. 표 402-3: 하이드로코티손 오전 10~20 mg, 저녁 5~10 mg. 스트레스 시 수 배 증량."
      location: {file: by_chapter/402장.md, line: 218}
    status: 개정
    current:
      text: >
        2차 부신기능부전은 글루코코르티코이드를 보충하며 광물코르티코이드는 필요 없다. 하이드로코르티손이 이상적 약이고 15–20 mg/일을 2–3회로 나눠 기상 직후 가장 많이, 점심 무렵, 필요하면 오후 4–6시 이전에 투여한다.
        프레드니손은 아침 1회 2.5–5 mg이며 환산은 프레드니손 1 mg = 하이드로코르티손 4 mg. 낮은 용량으로 시작해 과보충을 피하며, 하이드로코르티손 20 mg/일 초과(또는 등가)의 장기 사용은 대사 이상·쿠싱양 질환·사망 증가와 관련되어 피한다.
        스트레스·병중에는 회복될 때까지 2–3배로 올린다. 환자·가족을 교육하고 응급카드와 의료 경보 팔찌를 지니게 한다.
      sources:
        - {id: PAPER-BRAZIL-HYPOPITUITARISM-2021, locator: "Secondary adrenal insufficiency — glucocorticoid replacement"}
        - {id: PAPER-ADRENAL-INSUFFICIENCY-CRISIS-2021, locator: "Current glucocorticoid replacement therapy; Adrenal crisis"}
    verification: primary
    conflicts:
      - "원문 상한 25 mg/일(표 402-3은 오전 10–20 + 저녁 5–10 mg, 최대 30 mg) vs 현재 15–20 mg/일, 20 mg 초과 장기 사용 회피."
    review: {status: draft}
    corpus:
      - kind: dose_rule
        id: DR-GC-REPLACEMENT-SAI
        ingredient: hydrocortisone
        indication: 2차 부신기능부전(ACTH 결핍)
        source_priority: [PAPER-BRAZIL-HYPOPITUITARISM-2021, PAPER-ADRENAL-INSUFFICIENCY-CRISIS-2021]
        standard_dose: "하이드로코르티손 15–20 mg/일 2–3회 분할(기상 시 최대) 또는 프레드니손 2.5–5 mg 아침 1회"
        equivalence: "프레드니손 1 mg = 하이드로코르티손 4 mg"
        sick_day: "병중·스트레스 시 2–3배"
        rules:
          - {when: {var: hydrocortisone_equiv_mg_day, op: ">", value: 20}, action: "장기 과보충 — 대사·쿠싱양 이상, 사망 증가 관련", alert: caution}
          - {when: {all: [{finding: acth_deficiency}, {med: fludrocortisone}]}, action: "2차 부신기능부전에는 광물코르티코이드 불필요", alert: info}

  - id: 402-C04
    topic: 생식샘자극호르몬 결핍
    type: treatment
    original:
      text: "남성 테스토스테론 1~4주마다 근육주사, 패치, 젤. 폐경 전 여성 에스트로겐·프로게스테론 주기적 보충. 생식능 회복에 hCG·hMG."
      location: {file: by_chapter/402장.md, line: 240}
    status: 유지
    current:
      text: >
        남성은 오전 10시 이전 공복 총 테스토스테론이 낮고 FSH/LH가 낮거나 부적절하게 정상이면 진단하며(경계값은 같은 측정법으로 2회), 자극 검사는 필요 없다. 급성 질환, 글루코코르티코이드·아편유사제 등 영향을 주는 약을 고려한다.
        테스토스테론은 450–600 ng/dL을 유지하는 최소 용량으로 보충한다. 임신을 원하면 테스토스테론을 중단한다.
        폐경 전 연령의 모든 저생식샘자극호르몬 여성에게 성스테로이드를 보충하고(자궁이 있으면 프로게스토겐 병용, 예: MPA 2.5–10 mg 월 7–10일), 자연 폐경 연령 이후는 폐경 지침을 따른다. 여성에서 DHEA·테스토스테론의 일상적 사용은 권하지 않는다.
      sources:
        - {id: PAPER-BRAZIL-HYPOPITUITARISM-2021, locator: "Hypogonadotropic hypogonadism; Sex steroid replacement therapy; Fertility issues"}
    verification: primary
    review: {status: draft}
    corpus:
      - kind: workup
        trigger: {all: [{dx: E23.0}, {finding: male}, {finding: hypogonadism_symptoms}]}
        tests:
          - {lab: Testosterone_total, timing: "오전 10시 이전 공복, 경계값이면 2회", reason: "저생식샘자극호르몬 생식샘저하증"}
          - {lab: LH, reason: "낮거나 부적절하게 정상"}
          - {lab: FSH, reason: "낮거나 부적절하게 정상"}

  - id: 402-C05
    topic: 성인 성장호르몬 결핍
    type: dose
    original:
      text: "금기: 활동성 악성종양, 두개내 고혈압, 조절되지 않은 당뇨병과 망막증. 0.1~0.2 mg/일 시작, IGF-1 정상 중앙값 유지하도록 최고 1.25 mg/일까지 증량."
      location: {file: by_chapter/402장.md, line: 194}
    status: 개정
    current:
      text: >
        성인 성장호르몬 결핍은 IGF-I 단독 또는 자극 검사로 확진하며 기저 GH는 진단 가치가 없다. 인슐린 내성 검사 최고 GH 3 µg/L 미만(전환기 5 µg/L)이면 중증 결핍, 글루카곤 자극 검사 절단값은 3 µg/L(과체중·비만 1 µg/L).
        구조적 병변과 여러 뇌하수체 호르몬 결핍이 있는 고확률 환자는 연령·성별 하한 미만의 IGF-I만으로 진단할 수 있다(경구 에스트로겐, 조절 안 된 갑상선저하증, 영양실조, 간부전, 조절 안 된 당뇨는 IGF-I를 낮춤). 정상 IGF-I가 결핍을 배제하지는 않는다.
        금기는 활동성 악성종양, 조절되지 않은 당뇨, 당뇨망막병증, 두개내 고혈압. 체중 기준이 아닌 시작 용량: 60세 이상 0.1 mg, 젊은 남성 0.2 mg, 젊은 여성 0.3 mg, 전환기 0.4–0.7 mg을 매일 취침 전 피하주사.
        IGF-I가 연령 기준 중앙값–상한이 되도록 매달 조절하며 유지 용량은 대개 0.4–0.6 mg/일. 치료 중 2차 부신기능부전·중추성 갑상선저하증이 드러나거나 악화될 수 있어 코티솔과 유리 T4를 감시한다. 고령·비만·여성·당뇨 가족력은 공복 혈당·HbA1c를 감시한다.
      sources:
        - {id: PAPER-BRAZIL-HYPOPITUITARISM-2021, locator: "GH deficiency in adults; Table 5; Figure 2"}
    verification: primary
    conflicts:
      - "원문 최대 1.25 mg/일·IGF-1 중앙값 목표 vs 현재 유지 0.4–0.6 mg/일, IGF-I 중앙값–상한 목표, 나이·성별별 시작 용량."
    review: {status: draft}
    corpus:
      - kind: dose_rule
        id: DR-GH-ADULT
        ingredient: somatropin
        indication: 성인 성장호르몬 결핍
        source_priority: [PAPER-BRAZIL-HYPOPITUITARISM-2021]
        starting_dose: {age_ge_60: "0.1 mg/일", young_male: "0.2 mg/일", young_female: "0.3 mg/일", transition: "0.4–0.7 mg/일"}
        titration: "매달, IGF-I 연령 기준 중앙값–상한 목표"
        maintenance: "대개 0.4–0.6 mg/일"
        rules:
          - {when: {any: [{finding: active_malignancy}, {finding: intracranial_hypertension}, {finding: diabetic_retinopathy}, {finding: uncontrolled_diabetes}]}, action: "성장호르몬 금기", alert: contraindicated}
      - kind: monitoring
        after: {event: gh_therapy_start}
        check: [FT4, Cortisol_AM, IGF1]
        interval_weeks: [6]
        rules:
          - {when: {med: levothyroxine}, action: "GH 시작 6주 뒤 유리 T4 재평가"}

  - id: 402-C06
    topic: 바소프레신 결핍 보충
    type: dose
    original:
      text: "표 402-3: 비강내 데스모프레신 5~20 g 하루 2회; 경구 300~600 μg 하루 1회."
      location: {file: by_chapter/402장.md, line: 165}
    status: 개정
    current:
      text: "404-C01·404-C02 참조(병명 변경과 데스모프레신 허가 용량)."
      sources:
        - {id: OPENFDA-DESMOPRESSIN-ORAL, locator: "Dosage and Administration — Central Diabetes Insipidus"}
    verification: primary
    conflicts:
      - "원문 표 '비강내 데스모프레신 5~20 g'은 µg 단위 오기. 경구 '300~600 μg 하루 1회'는 미국 허가(0.05 mg 1일 2회 시작, 개별 조절)와 다름 — 404장에서 정리."
    review: {status: draft}
