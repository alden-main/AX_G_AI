  - id: 421-C08
    topic: LDL 콜레스테롤 계산식(Friedewald)
    type: formula
    original:
      text: "LDL-C = 총콜레스테롤 − 중성지방/5 − HDL-C. 공복 중성지방 ≤200에서 적용, ≥400이면 사용 불가."
      location: {file: by_chapter/421장.md, line: 322}
    status: 개정
    current:
      text: >
        LDL 콜레스테롤은 공복 상태에서 측정한 총콜레스테롤, 중성지방, HDL 콜레스테롤로 추정한다. 중성지방이 400 mg/dL 미만이면 중성지방을 5로 나눠 VLDL 콜레스테롤을 추정하고,
        LDL-C = 총콜레스테롤 − HDL-C − 중성지방/5(모두 mg/dL)로 계산한다. 중성지방이 400 mg/dL를 넘으면 이 방법은 정확하지 않다.
        국가건강검진도 LDL 콜레스테롤을 총콜레스테롤·HDL 콜레스테롤·중성지방으로 계산하되, 중성지방이 400 mg/dL 이상이면 직접 측정한다.
      sources:
        - {id: KR-HEALTH-SCREENING-NOTICE-2026, locator: "별표 1 4. 혈액검사 — 저밀도(LDL) 콜레스테롤 검사방법"}
        - {id: NHLBI-ATP3-2002, locator: "Section II.3 — LDL cholesterol estimation (p. II-2, ref. 617)"}
    verification: primary
    conflicts:
      - "19판 원문은 '중성지방 ≤200에서 적용'으로 요약했으나 ATP III·국가검진 기준은 400 mg/dL 미만(이상이면 직접 측정)."
    review: {status: draft}
    corpus:
      - kind: formula
        name: Friedewald LDL-C
        output: {var: LDL, unit: mg/dL}
        expression: "TC − HDL − TG/5"
        variables: {TC: "총콜레스테롤 mg/dL(공복)", HDL: "HDL 콜레스테롤 mg/dL", TG: "중성지방 mg/dL"}
        constraints: ["중성지방 400 mg/dL 이상이면 사용하지 않고 직접 측정", "공복 검체"]
