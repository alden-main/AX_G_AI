    topic: 스타틴 강도별 용량
    type: dose
    original:
      text: "표 421-5 고지혈증 치료 약제 요약(스타틴, 담즙산 결합수지, 에제티미브, 니코틴산, 피브레이트, 오메가-3)."
      location: {file: by_chapter/421장.md, line: 364}
    status: 개정
    current:
      text: >
        중강도: 로수바스타틴 5–10 mg, 아토르바스타틴 10–20 mg, 플루바스타틴 80 mg(XL) 또는 40 mg 1일 2회, 로바스타틴 40–80 mg, 피타바스타틴 1–4 mg,
        프라바스타틴 40–80 mg, 심바스타틴 20–40 mg. 고강도: 로수바스타틴 20–40 mg, 아토르바스타틴 40–80 mg(그 외는 고강도 해당 없음).
