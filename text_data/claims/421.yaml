# 421장 지질단백질 대사 이상 질환 — 주장(claim) 단위 최신화
# 스키마: text_data/claims/README.md

chapter: "421"
title: 지질단백질 대사 이상 질환
original_source: HARRISON-19-KO
updated_at: "2026-11-10"

claims:
  - id: 421-C01
    topic: 심혈관 위험도 평가
    type: workup
    original:
      text: "추가 검사와 치료는 AHA/ACC 가이드라인의 위험도 계산 등 전반적인 심혈관질환 위험성에 따라 결정."
      location: {file: by_chapter/421장.md, line: 322}
    status: 개정
    current:
      text: >
        일차예방의 심혈관 위험 평가는 PREVENT 위험 도구를 제안한다(Rec 1, Weak for — PCE보다 정확, 30–79세 10년·30년 위험, 인종 중립).
        중간–고위험이면 임상 결정에 영향을 줄 때 관상동맥 칼슘(CAC) 검사로 위험도를 보정하도록 제안하고(Rec 3), 저위험에는 일상적 CAC를 하지 않는다(Rec 4).
        위험 증가군 식별을 위해 Lp(a) 측정을 제안한다(Rec 5). ABI, ApoB, 다유전자 위험점수, 경동맥 플라크, hs-CRP의 일상적 사용은 근거 불충분(Rec 6).
      sources:
        - {id: VADOD-LIPIDS-2025, locator: "Recommendations 1–6; Sidebar 7"}
    verification: primary
    review: {status: draft}
    corpus:
      - kind: workup
        trigger: {all: [{not: {finding: established_ascvd}}, {var: age, op: ">=", value: 30}, {var: age, op: "<=", value: 79}]}
        tests:
          - {calc: PREVENT_10y_risk, reason: 일차예방 심혈관 위험 평가}
          - {lab: Lpa, reason: "위험 증가군 식별(Rec 5)"}
        strength: "VA/DoD Rec 1, 5 (Weak for)"

  - id: 421-C02
    topic: 일차예방 스타틴
    type: treatment
    original:
      text: "(원문은 AHA/ACC 위험도 기반 치료를 언급하며 구체 기준 없음)"
      location: {file: by_chapter/421장.md, line: 322}
    status: 보완
    current:
      text: >
        일차예방에서 당뇨, 10년 심혈관 위험 ≥10%(PREVENT), 또는 LDL-C ≥190 mg/dL이면 최소 중강도 스타틴을 권고한다(Rec 7, Strong for).
        당뇨가 없고 LDL-C <190, 10년 위험 약 5% 이상 10% 미만이면 중강도 스타틴을 제안한다(Rec 8, Weak for).
        HIV 환자는 10년 위험이 <5%로 낮아도 항레트로바이러스제와 상호작용이 적은 중강도 스타틴을 제안한다(Rec 10).
        기저 AST·ALT가 정상 상한 3배 미만이면 적응증대로 스타틴을 쓴다(Rec 11).
      sources:
        - {id: VADOD-LIPIDS-2025, locator: "Recommendations 7, 8, 10, 11"}
    verification: primary
    review: {status: draft}
    corpus:
      - kind: treatment
        condition: {kcd: [E78]}
        recommendations:
          - when: {all: [{not: {finding: established_ascvd}}, {any: [{dx: E11}, {var: PREVENT_10y_risk_pct, op: ">=", value: 10}, {var: LDL, op: ">=", value: 190}]}]}
            recommend: {drug_class: statin, intensity: "moderate 이상"}
            strength: "VA/DoD Rec 7 (Strong for)"
          - when: {all: [{not: {finding: established_ascvd}}, {not: {dx: E11}}, {var: LDL, op: "<", value: 190}, {var: PREVENT_10y_risk_pct, op: ">=", value: 5}, {var: PREVENT_10y_risk_pct, op: "<", value: 10}]}
            recommend: {drug_class: statin, intensity: moderate}
            strength: "VA/DoD Rec 8 (Weak for)"
          - when: {all: [{dx: B20}, {not: {finding: established_ascvd}}]}
            recommend: {drug_class: statin, intensity: moderate, note: "항레트로바이러스제 상호작용이 적은 약제"}
            strength: "VA/DoD Rec 10 (Weak for)"
          - when: {all: [{var: ALT_xULN, op: "<", value: 3}, {var: AST_xULN, op: "<", value: 3}]}
            recommend: {action: statin_not_withheld_for_mild_transaminase_elevation}
            strength: "VA/DoD Rec 11 (Weak for)"

  - id: 421-C03
    topic: 이차예방 지질 치료
    type: treatment
    original:
      text: "(원문은 관상동맥질환 환자 치료를 개별 약제 설명으로만 다룸)"
      location: {file: by_chapter/421장.md, line: 342}
    status: 보완
    current:
      text: >
        이차예방은 고강도 스타틴, 또는 중강도 스타틴+에제티미브, 또는 중강도 스타틴+PCSK9 억제제 중 하나를 제안한다(Rec 13).
        초고위험(지질강하 치료 중 최근 12개월 내 MI·ACS, 치료 중 재발한 ACS·MI·동맥경화성 뇌졸중, 또는 치료 중 ASCVD+LDL-C ≥70)은
        고강도·최대 내약 스타틴에 에제티미브 및/또는 PCSK9 억제제 병합을 제안한다(Rec 14).
        치료로 LDL-C <30 mg/dL가 되어도 지속을 제안한다(Rec 15). 고정 용량 고강도 스타틴 대비 목표치 치료(예: LDL-C <70)를 권고할 근거는 불충분하다(Rec 17).
        최근 관상동맥질환(MI, CAD 진단, CABG, PCI)에는 구조화된 운동 기반 심장재활을 권고한다(Rec 24, Strong for).
      sources:
        - {id: VADOD-LIPIDS-2025, locator: "Recommendations 13–15, 17, 24; Sidebar 4"}
    verification: primary
    review: {status: draft}
    corpus:
      - kind: treatment
        condition: {kcd: [I25, I63, I70]}
        recommendations:
          - when: {finding: established_ascvd}
            recommend: {options: ["고강도 스타틴", "중강도 스타틴+에제티미브", "중강도 스타틴+PCSK9 억제제"]}
            strength: "VA/DoD Rec 13 (Weak for)"
          - when: {all: [{finding: established_ascvd}, {med_class: lipid_lowering}, {any: [{event: mi_or_acs_within_12mo}, {event: recurrent_ascvd_event}, {var: LDL, op: ">=", value: 70}]}]}
            recommend: {options: ["고강도·최대 내약 스타틴+에제티미브", "+PCSK9 억제제", "+에제티미브+PCSK9 억제제"]}
            strength: "VA/DoD Rec 14 (Weak for)"
          - when: {all: [{med_class: lipid_lowering}, {var: LDL, op: "<", value: 30}]}
            recommend: {action: continue}
            strength: "VA/DoD Rec 15 (Weak for)"

