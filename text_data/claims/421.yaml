  - id: 421-C05
    topic: 스타틴 불내성
    type: treatment
    original:
      text: "(원문은 스타틴 근육 부작용을 약제 설명에서 언급)"
      location: {file: by_chapter/421장.md, line: 364}
    status: 보완
    current:
      text: >
        스타틴을 견디지 못하면 휴약기(예: 1개월) 후 같은 또는 다른 스타틴이나 더 낮은 용량으로 재투여하고, 실패하면 간헐(비매일) 투여를 시도한다(Rec 18).
        스타틴을 쓸 수 없으면 벰페도산, 에제티미브, 피브레이트, PCSK9 단클론항체 중 하나를 제안한다(Rec 19).
      sources:
        - {id: VADOD-LIPIDS-2025, locator: "Recommendations 18, 19; Sidebar 6"}
    verification: primary
    review: {status: draft}
    corpus:
      - kind: treatment
        condition: {kcd: [E78]}
        recommendations:
          - when: {finding: statin_intolerance}
            recommend: {steps: ["휴약기 후 같은/다른 스타틴 또는 저용량 재투여", "간헐 투여", "벰페도산·에제티미브·피브레이트·PCSK9 mAb"]}
            strength: "VA/DoD Rec 18, 19 (Weak for)"

  - id: 421-C06
    topic: 중성지방·피브레이트·오메가-3
    type: treatment
    original:
      text: >
        공복 중성지방 >1,000 mg/dL이면 킬로미크론혈증 — 급성 췌장염 위험으로 중성지방을 낮춰야 함. 고중성지방이면 공복혈당, 소변단백·크레아티닌,
        간기능, TSH로 이차 원인 배제.
      location: {file: by_chapter/421장.md, line: 330}
    status: 개정
    current:
      text: >
        중성지방 상승의 이차 원인(동반질환, 음주, 호르몬제·면역 관련 약·베타차단제·티아지드/루프 이뇨제·담즙산 결합수지·비정형 항정신병약·이소트레티노인 등)을 고려한다.
        이차예방에서 최대 내약 스타틴에도 공복 중성지방 ≥150 mg/dL가 지속되면 이코사펜트 에틸 2 g 1일 2회를 제안한다(Rec 16). 일차예방에서는 근거 불충분(Rec 9).
        스타틴에 피브레이트 추가는 제안하지 않는다(Rec 12). 이코사펜트 에틸 외의 오메가-3 보충제는 제안하지 않는다(Rec 21).
      sources:
        - {id: VADOD-LIPIDS-2025, locator: "Recommendations 9, 12, 16, 21; Sidebar 8"}
    verification: primary
    note: "중성지방 >1,000 mg/dL 췌장염 위험·킬로미크론혈증 기준은 A등급 근거 미확보(원문 대조용)."
    review: {status: draft}
    corpus:
      - kind: treatment
        condition: {kcd: [E78.1]}
        recommendations:
          - when: {all: [{finding: established_ascvd}, {med_class: statin}, {var: TG_fasting, op: ">=", value: 150}]}
            recommend: {ingredient: icosapent_ethyl, dose: "2 g 1일 2회"}
            strength: "VA/DoD Rec 16 (Weak for)"
          - when: {all: [{med_class: statin}, {med_class: fibrate}]}
            recommend: {action: avoid_combination, detail: "스타틴+피브레이트 추가 비권장"}
            strength: "VA/DoD Rec 12 (Weak against)"
            alert_level: low
          - when: {med_class: omega3_supplement}
            recommend: {action: avoid, detail: "이코사펜트 에틸 외 오메가-3 보충제"}
            strength: "VA/DoD Rec 21 (Weak against)"
      - kind: workup
        trigger: {var: TG, op: ">=", value: 150}
        tests:
          - {review: medications, reason: "중성지방 상승 유발 약물(호르몬, 베타차단제, 티아지드/루프 이뇨제, 담즙산 결합수지, 비정형 항정신병약, 이소트레티노인 등)"}
          - {review: alcohol_intake, reason: 이차 원인}

  - id: 421-C07
    topic: 생활습관 중재
    type: treatment
    original:
      text: "(원문은 식이·체중 조절을 일반적으로 언급)"
      location: {file: by_chapter/421장.md, line: 342}
