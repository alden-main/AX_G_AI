claims:
  - id: 429-C01
    topic: 항구리 치료 선택(킬레이트제·아연)
    type: treatment
    original:
      text: "표 429-2: 간질환 발현(간부전 없음) 1차 아연·2차 트리엔틴, 간부전 트리엔틴+아연, 신경 발현 테트라사이오몰립데이트+아연, 유지 아연. 페니실라민은 부작용·신경 악화로 역할이 작음."
      location: {file: by_chapter/429장.md, line: 55}
    status: 유지
    current:
      text: >
        치료는 구리 킬레이트제(d-페니실라민, 트리엔틴), 아연염, 간이식이며 평생 치료한다. 킬레이트가 표준 치료로 대부분 큰 이득이 있고, 급성 간부전에서는 간이식이 유일한 치료다.
        16개 연구 메타분석: 증상성 간형에서 d-페니실라민과 아연의 치료 효과에 차이가 없었고(RR 0.98), 신경형 호전율은 d-페니실라민 56% vs 아연 80%였다. d-페니실라민은 아연보다 이상반응(RR 2.42)과 신경학적 악화(RR 1.96)가 많았다.
        트리엔틴(미국 허가)은 페니실라민을 견디지 못하는 환자에 적응이 있으며 페니실라민과 상호 대체 가능한 약으로 보지 않는다.
      sources:
        - {id: PAPER-WILSON-REVIEW-2022, locator: "Current treatments"}
        - {id: PAPER-WILSON-DPEN-ZINC-SR-2022, locator: "Results; Conclusion"}
        - {id: OPENFDA-TRIENTINE, locator: "Indications and Usage"}
    verification: primary
    note: "테트라사이오몰립데이트는 승인되지 않음(개발 중단). 트리엔틴 사수화물(Cuvrior, 2022 미국 승인)·용량은 미대조."
    review: {status: draft}
