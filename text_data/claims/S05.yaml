  - id: S05-C10
    topic: 국가건강검진 연령별 검사 항목
    type: workup
    status: 보완
    current:
      text: >
        일반건강검진의 연령·성별 검사 항목(건강검진 실시기준 별표 1): 이상지질혈증 4종(총·HDL·LDL 콜레스테롤, 중성지방)은 남성 24세 이상, 여성 40세 이상에서 4년마다.
        B형간염 표면항원·항체는 40세(표면항원 양성자, 예방접종 등으로 항체가 형성된 사람은 제외). C형간염 항체는 56세.
        골밀도 검사는 54·60·66세 여성. 기본 폐기능 검사는 56·66세. 인지기능장애 평가(KDSQ-C)는 66세 이상 2년마다이며 6점 이상이면 신경과·정신건강의학과 등 전문의나 치매안심센터로 안내한다.
        우울증 검사(PHQ-9)는 20–34세 2년마다, 35–39·40–49·50–59·60–69·70–79세에 각 1회이며, 총점 10점 이상이거나 9번 문항 1점 이상이면 정신건강의학과 등 전문의로 의뢰한다.
        조기정신증 검사(CAPE-15)는 20–34세 2년마다이며 빈도 또는 고통 총점 6점 이상이면 의뢰한다. 노인 신체기능 검사(낙상: 하지기능·평형성)는 66·70·80세.
        생활습관 평가(흡연·음주·운동·영양·비만)는 40·50·60·70세. 혈압은 5분 이상 안정 후 재며, 120/80 mmHg 이상이면 2분 이상 간격을 두고 다시 잰다.
        국가검진의 eGFR은 나이·성별·혈청 크레아티닌으로 CKD-EPI 식(2009 계수)으로 계산한다.
      sources:
        - {id: KR-HEALTH-SCREENING-NOTICE-2026, locator: "별표 1 일반건강검진 검사항목·대상자·검사방법(혈액검사, 간염검사, 골밀도, 폐기능, 인지기능, 생활습관평가, 정신건강검사, 노인신체기능검사)"}
    verification: primary
    conflicts:
      - "국가검진 eGFR은 CKD-EPI 2009 계수(141·144) 식이고, 이 시스템의 계산식은 CKD-EPI 2021 — 같은 크레아티닌이라도 값이 다를 수 있음(검사실 보고값을 우선)."
      - "B형·C형간염 선별: 미국(CDC)은 성인 전체 1회 선별, 국내 국가검진은 40세(B형)·56세(C형) — 국내 기준을 우선하고 미국 기준은 참고로 표시."
    review: {status: draft}
    corpus:
      - kind: workup
        trigger:
          all:
            - any:
                - {all: [{finding: male}, {var: age, op: ">=", value: 24}]}
                - {all: [{not: {finding: male}}, {var: age, op: ">=", value: 40}]}
            - {not: {finding: lipid_panel_within_4_years}}
        tests:
          - {lab: Total_cholesterol, reason: "국가검진 이상지질혈증 — 4년마다"}
          - {lab: HDL, reason: "국가검진 이상지질혈증 — 4년마다"}
          - {lab: TG, reason: "국가검진 이상지질혈증 — 4년마다"}
          - {lab: LDL, reason: "국가검진 이상지질혈증 — 4년마다"}
      - kind: workup
        preferred_over: [362-C01-K1]
        trigger:
          all:
            - {var: age, op: ">=", value: 40}
            - {var: age, op: "<", value: 41}
            - {not: {finding: hbsag_positive}}
            - {not: {finding: hbv_immune}}
        tests:
          - {lab: HBsAg, reason: "국가검진 40세 B형간염 검사"}
          - {lab: Anti_HBs, reason: "국가검진 40세 B형간염 검사"}
      - kind: workup
        preferred_over: [362-C04-K1]
        trigger:
          all:
            - {var: age, op: ">=", value: 56}
            - {var: age, op: "<", value: 57}
        tests:
          - {lab: Anti_HCV, reason: "국가검진 56세 C형간염 항체 검사 — 양성이면 확진검사"}
      - kind: workup
        trigger:
          all:
            - {not: {finding: male}}
            - any:
                - {all: [{var: age, op: ">=", value: 54}, {var: age, op: "<", value: 55}]}
                - {all: [{var: age, op: ">=", value: 60}, {var: age, op: "<", value: 61}]}
                - {all: [{var: age, op: ">=", value: 66}, {var: age, op: "<", value: 67}]}
        tests:
          - {exam: DXA, reason: "국가검진 골밀도 — 54·60·66세 여성"}
      - kind: workup
        trigger:
          any:
            - {all: [{var: age, op: ">=", value: 56}, {var: age, op: "<", value: 57}]}
            - {all: [{var: age, op: ">=", value: 66}, {var: age, op: "<", value: 67}]}
        tests:
          - {exam: Spirometry_basic, reason: "국가검진 폐기능 — 56·66세"}
      - kind: workup
        trigger: {var: age, op: ">=", value: 66}
        tests:
          - {score: KDSQ_C, reason: "국가검진 인지기능 — 66세 이상 2년마다(6점 이상 전문의·치매안심센터 안내)"}
      - kind: workup
        trigger:
          all:
            - {var: age, op: ">=", value: 20}
            - {var: age, op: "<", value: 80}
        tests:
          - {score: PHQ9, reason: "국가검진 우울증 — 20–34세 2년마다, 이후 연령대별 1회"}
      - kind: workup
        trigger:
          all:
            - {var: age, op: ">=", value: 20}
            - {var: age, op: "<", value: 35}
        tests:
          - {score: CAPE15, reason: "국가검진 조기정신증 — 20–34세 2년마다"}
      - kind: workup
        trigger:
          any:
            - {all: [{var: age, op: ">=", value: 66}, {var: age, op: "<", value: 67}]}
            - {all: [{var: age, op: ">=", value: 70}, {var: age, op: "<", value: 71}]}
            - {all: [{var: age, op: ">=", value: 80}, {var: age, op: "<", value: 81}]}
        tests:
          - {exam: Elderly_fall_test, reason: "국가검진 노인 신체기능(낙상) — 66·70·80세"}
      - kind: referral
        to: 신경과·정신건강의학과 등 전문의 또는 치매안심센터
        purpose: "인지기능장애 평가(KDSQ-C) 6점 이상 — 자세한 검사와 진료"
        criteria:
          - {var: KDSQ_C, op: ">=", value: 6}
      - kind: referral
        to: 정신건강의학과 등 전문의(정신건강복지센터 상담 안내)
        purpose: "PHQ-9 10점 이상(주요우울장애 의심) 또는 9번 문항 1점 이상"
        criteria:
          - {var: PHQ9, op: ">=", value: 10}
          - {finding: phq9_item9_positive}
      - kind: referral
        to: 정신건강의학과 등 전문의(정신건강복지센터 상담 안내)
        purpose: "CAPE-15 빈도 또는 고통 총점 6점 이상"
        criteria:
          - {var: CAPE15, op: ">=", value: 6}

  - id: S05-C11
    topic: 국가예방접종 대상(성인 중심)
    type: workup
    status: 보완
    current:
      text: >
        국가예방접종 대상과 표준접종시기(예방접종의 실시기준 및 방법 별표 1) 중 성인 관련 항목:
        인플루엔자는 65세 이상, 생후 6개월–14세, 임신부, 조혈모세포이식 환자에게 매년 국가예방접종사업 시기에 1회(과거 접종력이 없는 6개월–9세 미만 소아는 첫해 1개월 간격 2회).
        폐렴구균은 65세 이상 노인에게 폐렴구균 다당질 백신으로 1회 접종한다(영유아·18세 이하 고위험군은 단백결합 백신).
        사람유두종바이러스(HPV)는 12–26세 여성(18–26세는 저소득층으로 한정)과 12세 남성이 대상이며, 12–14세 여성은 0·6개월 2회, 15–26세 여성은 0·2·6개월 3회 접종한다.
      sources:
        - {id: KR-NIP-NOTICE-2026, locator: "제3조, 별표 1 ⑥ 폐렴구균, ⑫ 사람유두종바이러스 감염증, ⑬ 인플루엔자"}
    verification: primary
    note: "국가가 비용을 지원하는 접종 대상·시기이며, 그 밖의 접종 권고(예: 대상포진)는 이 고시 범위가 아니다."
    review: {status: draft}
    corpus:
      - kind: workup
        trigger:
          all:
            - {any: [{var: age, op: ">=", value: 65}, {finding: pregnancy}]}
            - {not: {finding: influenza_vaccinated_this_season}}
        tests:
          - {screen: Influenza_vaccination, reason: "국가예방접종 — 매년 사업 시기 1회(65세 이상·임신부)"}
      - kind: workup
        trigger:
          all:
            - {var: age, op: ">=", value: 65}
            - {not: {finding: ppsv23_received}}
        tests:
          - {screen: PPSV23_vaccination, reason: "국가예방접종 — 65세 이상 1회"}
      - kind: workup
        trigger:
          all:
            - {not: {finding: male}}
            - {var: age, op: ">=", value: 12}
            - {var: age, op: "<", value: 27}
            - {not: {finding: hpv_vaccination_complete}}
        tests:
          - {screen: HPV_vaccination, reason: "국가예방접종 — 12–17세 여성, 18–26세는 저소득층 여성"}

  - id: S05-C12
    topic: 결핵·잠복결핵감염 검진 의무기관 종사자
