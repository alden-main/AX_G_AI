# 약제 개념 사전 — 말뭉치의 성분(med·ingredient)·약효군(med_class)을 표준 성분으로 묶는다.
# 스키마·사용법: text_data/mappings/README.md
#
# ingredients
#   id         말뭉치 성분 식별자(snake_case)
#   rxnorm     RxNorm 성분명(생략 시 id 의 _ → 공백). tools/verify_codes.py 가 RxCUI·FDA EPC 를 확인한다.
#   ko         국내 성분명(식약처·심평원 표기). EMR 약품명 괄호 안 성분과 앞부분 일치로 비교한다.
#   corpus_ids 말뭉치 동의어(용법·제형이 붙은 식별자 포함)
#   classes    소속 약효군(classes 의 id). 약효군 members 에서 자동 역산하므로 여기 적지 않는다.
# products   복합제. components = 성분 id
# classes
#   members    성분 id, includes = 다른 약효군 id
#   exhaustive true 이면 국내외 허가 성분을 모두 담았다고 본다 → 목록 밖 성분만 처방되면 '해당 없음(False)'.
#              false 이면 목록 밖 성분이 처방됐을 때 '알 수 없음(None)'으로 둔다.
#   derivable  false 이면 처방 목록만으로 판정할 수 없다(용량·기간·임상 판단 필요) → 사이트 매핑이 지정하지 않으면 None.
#   systemic_only  국소 제형(크림·연고·점안·흡입·질정 등)이면 이 약효군에 넣지 않는다.
#   derive_from + routes  상위 약효군 성분 중 해당 투여 경로인 것만(경로를 모르면 None).
#
# 국외 표준 코드(ATC)는 WHO 이용 조건(상업적 재배포 제한) 때문에 저장하지 않는다.

