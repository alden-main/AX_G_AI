# 검사·변수 개념 사전 — 말뭉치(corpus/*.jsonl)의 검사·변수 식별자를 표준 개념으로 묶는다.
# 스키마·사용법: text_data/mappings/README.md
#
# 구역
#   labs         검체 검사(결과값이 있는 단일 항목). unit = 말뭉치 기준 단위, convert = 다른 단위 → 기준 단위 배수
#   panels       묶음 검사(CBC, LFT 등). members = labs 개념 id
#   exams        영상·내시경·생검·기능검사(결과는 판독문). 수치 결과는 measurements 로 분리
#   measurements 검사 판독·간호 기록에서 나오는 수치(폐기능, 골밀도, 결석 크기 등)
#   vitals       활력 징후·신체 계측
#   scores       임상 척도(임상의 입력)
#   derived      다른 값으로 계산하는 변수(inputs = 개념 id)
#   med_derived  처방 이력으로 계산하는 변수
#   clinical     병력·경과 기간 등 임상의 입력
#   tasks        검사가 아닌 감시 행위
#
# corpus_ids : 말뭉치에서 이 개념을 가리키는 식별자(동의어 포함). 개념 id 는 자동 포함.
# aliases    : EMR itemName/examCode 자동 제안용 이름(대소문자·공백·기호 무시). 제안일 뿐 값은 쓰지 않는다.
# loinc      : LOINC 코드. tools/verify_codes.py 로 NLM Clinical Tables 에서 이름을 확인한 코드만 둔다.

