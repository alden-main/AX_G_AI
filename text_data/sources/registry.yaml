# 출처 레지스트리
# - 모든 주장(claims/*.yaml)과 말뭉치(corpus/*.jsonl)는 여기의 id로만 출처를 참조한다.
# - checked_at: 실제로 내용을 확인한 날짜.
# - access: primary_text  = 원문(PDF/본문)을 직접 읽어 확인
#           secondary     = 원문을 요약한 2차 자료로만 확인(원문 접근 실패)
#           local_db      = 프로젝트 로컬 참조 DB에서 확인(원본 발행일·버전 미상)
#
# ai_use (AX-G AI는 상업 서비스 — 2026-11-10 사용자 확인):
#   A = 출처를 밝히고 상업 AI 서비스에 사용 가능 (퍼블릭 도메인, CC0, 이용허락 제한 없는 공공데이터 등)
#   B = 비상업·변경금지 등 조건부 라이선스 (CC BY-NC, CC BY-NC-ND, 공공누리 2~4유형) → 허가 필요
#   C = 권리자 별도 허가 필요 (저작권 보호, AI·TDM 사용 금지 명시 등)
#   U = 이용 조건 미확인 → 확인 전까지 허가 필요로 취급
# AI가 사용하는 주장(current)은 A등급 출처만 인용할 수 있다. B·C·U 근거는 reference에만 둔다.
# region: 출처 국가·지역 — KR(국내) > US(미국) > EU(유럽) > INTL(그 밖·국제) 순으로 우선한다(같은 주제에 국내 기준이 있으면 국외 기준은 참고로).
# license_basis: 등급 판단 근거. 법률 자문이 아니며 운영 전 법무 검토 대상이다.
#   A등급은 license_basis에 라이선스(CC0 1.0 / CC BY[ x.x] / 17 U.S.C. 또는 퍼블릭 도메인 / copyright free)를 반드시 적는다.
#   build_corpus.py가 여기서 화면 출처 표시용 license를 뽑고, 못 뽑으면 빌드를 실패시킨다. citation은 그대로 화면에 표시된다.

